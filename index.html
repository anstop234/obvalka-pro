<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Обвалка PRO v 6.1</title>
<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #f0f0f0;
    --text-dim: #9e9e9e;
    --border: #555555;
    --green: #00c853;
    --green-dark: #009624;
    --green-bg: rgba(0, 200, 83, 0.14);
    --yellow: #ffab00;
    --yellow-bg: rgba(255, 171, 0, 0.18);
    --red: #ff5252;
    --red-bg: rgba(255, 82, 82, 0.14);
    --input-bg: #262626;
    --cal-num: #ffffff;
    --cal-dim: #666666;
  }
  body.light {
    --bg: #f2f2f2;
    --card: #ffffff;
    --text: #111111;
    --text-dim: #555555;
    --border: #888888;
    --green: #00a844;
    --green-dark: #007e33;
    --green-bg: rgba(0, 168, 68, 0.12);
    --yellow: #ffab00;
    --yellow-bg: rgba(255, 171, 0, 0.25);
    --red: #d32f2f;
    --red-bg: rgba(211, 47, 47, 0.1);
    --input-bg: #f9f9f9;
    --cal-num: #000000;
    --cal-dim: #000000;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  body {
    margin: 0;
    padding: 6px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 6px 8px;
    border: 1px solid rgba(128,128,128,0.18);
  }
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .nav-btn {
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 28px;
    height: 24px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .month-title-wrap {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .month-title {
    font-size: 16px;
    font-weight: 700;
  }
  .version-tag {
    font-size: 10px;
    font-weight: 500;
    color: #e0e0e0;
    opacity: 0.85;
  }
  body.light .version-tag {
    color: #333333;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .icon-btn {
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 26px;
    height: 24px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .theme-btn {
    background: #f0f0f0;
    color: #111;
  }
  body.light .theme-btn {
    background: #252525;
    color: #fff;
  }
  .upd-btn {
    background: var(--input-bg);
    color: var(--text);
  }
  .tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }
  .tab-btn {
    background: var(--input-bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 0;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--green);
    color: #000;
    border-color: var(--green);
  }
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
  }
  .day-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3px 0;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--cal-num);
    cursor: pointer;
    position: relative;
    line-height: 1.15;
    border: 1px solid transparent;
  }
  .day-cell.other-month {
    color: var(--cal-dim);
    opacity: 0.45;
  }
  body.light .day-cell.other-month {
    color: #000000;
    opacity: 0.4;
  }
  .day-cell.in-range {
    background: var(--yellow-bg);
  }
  .day-cell.selected {
    background: var(--yellow) !important;
    color: #000000 !important;
    font-weight: 800;
  }
  .day-cell.day-off {
    border-color: var(--red);
  }
  .off-mark {
    position: absolute;
    top: 0px;
    right: 2px;
    font-size: 8px;
    color: var(--red);
    font-weight: 900;
    line-height: 1;
  }
  .data-bar {
    width: 14px;
    height: 2px;
    background: var(--green);
    border-radius: 1px;
    margin-top: 2px;
  }
  .day-cell.selected .data-bar {
    background: #000000;
  }
  .cal-hint {
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 3px;
  }
  .dayoff-block {
    padding: 4px 8px;
  }
  .btn-dayoff-long {
    width: 100%;
    height: 24px;
    background: var(--red-bg);
    color: var(--red);
    border: 1px solid var(--red);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    letter-spacing: 0.3px;
  }
  .records-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 3px;
    min-height: 20px;
  }
  .records-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .undo-wrap {
    display: none;
    align-items: center;
    gap: 4px;
  }
  .btn-undo {
    background: var(--yellow);
    color: #000;
    border: none;
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-clear-undo {
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .records-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 110px;
    overflow-y: auto;
  }
  .rec-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--input-bg);
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 12px;
    line-height: 1.15;
    border: 1px solid rgba(128,128,128,0.15);
  }
  .rec-del {
    color: var(--red);
    font-weight: 700;
    cursor: pointer;
    padding: 0 4px;
    font-size: 13px;
  }
  .summary-card {
    background: var(--green-bg);
    border: 1px solid rgba(0, 200, 83, 0.35);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .summary-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .summary-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--green);
    text-transform: uppercase;
  }
  .summary-vals {
    font-size: 12px;
    font-weight: 700;
  }
  .summary-money {
    font-size: 18px;
    font-weight: 800;
    color: var(--yellow);
    line-height: 1.1;
  }
  .report-btns {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  .btn-rep {
    border: none;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    text-align: center;
  }
  .btn-rep-full {
    background: var(--green);
    color: #000;
  }
  .btn-rep-short {
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .input-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
    font-size: 12px;
  }
  .selected-date-label {
    font-weight: 700;
    color: var(--text);
  }
  .form-rows {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .form-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .form-row label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .form-row input {
    width: 145px;
    height: 30px;
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 8px;
    font-size: 14px;
    font-weight: 700;
    text-align: right;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .form-row input:focus {
    border-color: var(--green);
  }
  .shift-preview {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    margin-top: 5px;
    font-size: 12px;
    font-weight: 700;
  }
  .shift-money {
    color: var(--yellow);
    font-size: 15px;
    font-weight: 800;
  }
  .btn-add-full {
    width: 100%;
    height: 34px;
    margin-top: 5px;
    background: var(--green);
    color: #000;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  .backup-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .btn-backup {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    height: 32px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  .modal-backdrop.top-modal {
    z-index: 2000;
  }
  .modal-box {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 400px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .modal-title {
    font-size: 15px;
    font-weight: 700;
  }
  .modal-textarea {
    width: 100%;
    height: 150px;
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    font-family: monospace;
    font-size: 12px;
    resize: none;
    outline: none;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .btn-modal {
    padding: 7px 14px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
  }
  .btn-modal-primary {
    background: var(--green);
    color: #000;
    border-color: var(--green);
  }
  .btn-modal-danger {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
  }
  .backup-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
  }
  .backup-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 8px;
    font-size: 12px;
  }
  .backup-item-btns {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-restore-sm {
    background: var(--green);
    color: #000;
    border: none;
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-del-backup {
    background: var(--red-bg);
    color: var(--red);
    border: 1px solid var(--red);
    border-radius: 5px;
    padding: 3px 7px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    color: #fff;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    z-index: 3000;
    display: none;
    border: 1px solid var(--border);
  }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="cal-header">
      <button class="nav-btn" id="prevMonth">◀</button>
      <div class="month-title-wrap">
        <span class="month-title" id="monthTitle">Ноябрь 2026</span>
        <span class="version-tag" id="verTag">v 6.1</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn upd-btn" id="btnCheckUpd" title="Проверить обновление">🔄</button>
        <button class="icon-btn theme-btn" id="btnTheme" title="Сменить тему">☀️</button>
        <button class="nav-btn" id="nextMonth">▶</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-mode="day">День</button>
      <button class="tab-btn" data-mode="week">Неделя</button>
      <button class="tab-btn" data-mode="biweek">2х недели</button>
      <button class="tab-btn" data-mode="month">Месяц</button>
      <button class="tab-btn" data-mode="year">Год</button>
    </div>
    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-hint">Нажмите на день или протяните пальцем для выбора периода</div>
  </div>

  <div class="card dayoff-block">
    <button class="btn-dayoff-long" id="btnDayOff">✕ ВЫХОДНОЙ</button>
  </div>

  <div class="card">
    <div class="records-header">
      <div class="records-title" id="recordsTitle">ЗАПИСИ (ДЕНЬ)</div>
      <div class="undo-wrap" id="undoWrap">
        <button class="btn-undo" id="btnUndo">↩ Отменить удаление (0)</button>
        <button class="btn-clear-undo" id="btnClearUndo">✕</button>
      </div>
    </div>
    <div class="records-list" id="recordsList"></div>
  </div>

  <div class="card summary-card">
    <div class="summary-info">
      <div class="summary-label" id="summaryLabel">ИТОГ ЗА ДЕНЬ</div>
      <div class="summary-vals" id="summaryVals">0 кор. • 0 кг</div>
      <div class="summary-money" id="summaryMoney">0 ₽</div>
    </div>
    <div class="report-btns">
      <button class="btn-rep btn-rep-full" id="btnFullRep">📤 Полный отчёт</button>
      <button class="btn-rep btn-rep-short" id="btnShortRep">📋 Краткий отчёт</button>
    </div>
  </div>

  <div class="card">
    <div class="input-header">
      <span style="color:var(--text-dim)">Выбрана дата:</span>
      <span class="selected-date-label" id="selectedDateLabel">22 ноября</span>
    </div>
    <div class="form-rows">
      <div class="form-row">
        <label for="inpWorker">Обвальщик:</label>
        <input type="text" id="inpWorker" placeholder="Имя" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="inpBoxes">Коробки (шт):</label>
        <input type="text" inputmode="numeric" id="inpBoxes" placeholder="0" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="inpWeight">Вес коробки (кг):</label>
        <input type="text" inputmode="decimal" id="inpWeight" placeholder="00.0" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="inpRate">Ставка за 1 кг (₽):</label>
        <input type="text" inputmode="decimal" id="inpRate" placeholder="0.0" autocomplete="off">
      </div>
    </div>
    <div class="shift-preview">
      <span>ИТОГО ЗА СМЕНУ:</span>
      <span id="shiftWeight">0 кг</span>
      <span class="shift-money" id="shiftMoney">0 ₽</span>
    </div>
    <button class="btn-add-full" id="btnAdd">+ ДОБАВИТЬ ЗАПИСЬ</button>
  </div>

  <div class="backup-row">
    <button class="btn-backup" id="btnSaveBackup">💾 СОХРАНИТЬ БАЗУ</button>
    <button class="btn-backup" id="btnOpenRestore">📂 ВОССТАНОВИТЬ</button>
  </div>
</div>

<div class="modal-backdrop" id="reportModal">
  <div class="modal-box">
    <div class="modal-title" id="reportModalTitle">Отчёт</div>
    <textarea class="modal-textarea" id="reportTextarea" readonly></textarea>
    <div class="modal-actions">
      <button class="btn-modal" id="btnReportCancel">Отмена</button>
      <button class="btn-modal btn-modal-primary" id="btnReportSend">Отправить</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="restoreModal">
  <div class="modal-box">
    <div class="modal-title">Сохранённые копии в телефоне</div>
    <div class="backup-list" id="backupList"></div>
    <div class="modal-actions">
      <button class="btn-modal" id="btnCloseRestore">Закрыть</button>
    </div>
  </div>
</div>

<div class="modal-backdrop top-modal" id="confirmModal">
  <div class="modal-box">
    <div class="modal-title" id="confirmText">Вы уверены?</div>
    <div class="modal-actions">
      <button class="btn-modal" id="btnConfirmNo">Нет</button>
      <button class="btn-modal btn-modal-danger" id="btnConfirmYes">Да</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  var APP_VERSION = "6.1";
  var STORAGE_KEY = "obvalka_pro_data_v1";
  var BACKUPS_KEY = "obvalka_pro_backups_v1";
  var WORKER_KEY = "obvalka_pro_worker_v1";
  var RATE_KEY = "obvalka_pro_rate_v1";
  var THEME_KEY = "obvalka_pro_theme_v1";

  var MONTHS_NOM = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  var MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var MONTHS_SHORT = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

  function safeGet(k, def) {
    try {
      var v = localStorage.getItem(k);
      return v !== null ? v : def;
    } catch (e) {
      return def;
    }
  }
  function safeSet(k, v) {
    try {
      localStorage.setItem(k, v);
    } catch (e) {}
  }

  var state = {
    viewYear: 2026,
    viewMonth: 10,
    selectedDate: "2026-11-22",
    rangeStart: null,
    rangeEnd: null,
    isCustomRange: false,
    mode: "day",
    records: {},
    dayOffs: {},
    undoStack: [],
    isDragging: false,
    dragAnchor: null
  };

  var confirmCallback = null;

  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(t._timer);
    t._timer = setTimeout(function() { t.style.display = "none"; }, 2200);
  }

  function openConfirm(text, onYes) {
    document.getElementById("confirmText").textContent = text;
    confirmCallback = onYes;
    document.getElementById("confirmModal").style.display = "flex";
  }

  document.getElementById("btnConfirmNo").onclick = function() {
    document.getElementById("confirmModal").style.display = "none";
    confirmCallback = null;
  };
  document.getElementById("btnConfirmYes").onclick = function() {
    document.getElementById("confirmModal").style.display = "none";
    if (confirmCallback) confirmCallback();
    confirmCallback = null;
  };

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function toKey(y, m, d) { return y + "-" + pad2(m + 1) + "-" + pad2(d); }
  function parseKey(k) {
    var p = k.split("-");
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }
  function dateToKey(dt) {
    return toKey(dt.getFullYear(), dt.getMonth(), dt.getDate());
  }
  function formatHumanDate(k) {
    var p = k.split("-");
    var d = parseInt(p[2], 10);
    var m = parseInt(p[1], 10) - 1;
    return d + " " + MONTHS_GEN[m];
  }
  function formatShortDate(k) {
    var p = k.split("-");
    var d = parseInt(p[2], 10);
    var m = parseInt(p[1], 10) - 1;
    return d + " " + MONTHS_SHORT[m];
  }
  function cleanNum(val) {
    var n = parseFloat(String(val).replace(",", "."));
    return isFinite(n) && n >= 0 ? n : 0;
  }
  function fmtWeight(w) {
    return (Math.round(w * 10) / 10).toFixed(1).replace(/\.0$/, "");
  }
  function fmtMoney(m) {
    return (Math.round(m * 100) / 100).toFixed(2).replace(/\.00$/, "");
  }

  function loadData() {
    var raw = safeGet(STORAGE_KEY, "");
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        state.records = parsed.records || {};
        state.dayOffs = parsed.dayOffs || {};
        Object.keys(state.records).forEach(function(dk) {
          state.records[dk] = (state.records[dk] || []).map(function(r) {
            var b = cleanNum(r.boxes);
            var w = cleanNum(r.weight);
            var rt = cleanNum(r.rate);
            return { boxes: b, weight: w, rate: rt, sum: b * w * rt };
          });
        });
      } catch (e) {}
    }
    var savedWorker = safeGet(WORKER_KEY, "");
    if (savedWorker) document.getElementById("inpWorker").value = savedWorker;
    var savedRate = safeGet(RATE_KEY, "");
    if (savedRate) document.getElementById("inpRate").value = savedRate;
    var savedTheme = safeGet(THEME_KEY, "dark");
    if (savedTheme === "light") {
      document.body.classList.add("light");
      document.getElementById("btnTheme").textContent = "🌙";
    }
  }

  function saveData() {
    safeSet(STORAGE_KEY, JSON.stringify({
      records: state.records,
      dayOffs: state.dayOffs
    }));
  }

  function getActiveRange() {
    if (state.isCustomRange && state.rangeStart && state.rangeEnd) {
      return state.rangeStart <= state.rangeEnd
        ? { start: state.rangeStart, end: state.rangeEnd }
        : { start: state.rangeEnd, end: state.rangeStart };
    }
    var dt = parseKey(state.selectedDate);
    var y = dt.getFullYear();
    var m = dt.getMonth();
    var d = dt.getDate();

    if (state.mode === "day") {
      return { start: state.selectedDate, end: state.selectedDate };
    }
    if (state.mode === "week") {
      var dayOfWeek = dt.getDay();
      var diffToMon = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      var mon = new Date(y, m, d + diffToMon);
      var sun = new Date(y, m, d + diffToMon + 6);
      return { start: dateToKey(mon), end: dateToKey(sun) };
    }
    if (state.mode === "biweek") {
      var lastDay = new Date(y, m + 1, 0).getDate();
      if (d <= 15) {
        return { start: toKey(y, m, 1), end: toKey(y, m, 15) };
      } else {
        return { start: toKey(y, m, 16), end: toKey(y, m, lastDay) };
      }
    }
    if (state.mode === "month") {
      var lastM = new Date(y, m + 1, 0).getDate();
      return { start: toKey(y, m, 1), end: toKey(y, m, lastM) };
    }
    if (state.mode === "year") {
      return { start: toKey(y, 0, 1), end: toKey(y, 11, 31) };
    }
    return { start: state.selectedDate, end: state.selectedDate };
  }

  function enumerateDates(startKey, endKey) {
    var res = [];
    var cur = parseKey(startKey);
    var end = parseKey(endKey);
    while (cur <= end) {
      res.push(dateToKey(cur));
      cur.setDate(cur.getDate() + 1);
    }
    return res;
  }

  function renderCalendar() {
    document.getElementById("monthTitle").textContent = MONTHS_NOM[state.viewMonth] + " " + state.viewYear;
    var grid = document.getElementById("calGrid");
    grid.innerHTML = "";

    var firstDay = new Date(state.viewYear, state.viewMonth, 1).getDay();
    var startOffset = firstDay === 0 ? 6 : firstDay - 1;
    var daysInMonth = new Date(state.viewYear, state.viewMonth + 1, 0).getDate();
    var prevMonthDays = new Date(state.viewYear, state.viewMonth, 0).getDate();

    var rng = getActiveRange();
    var showRangeHighlight = (state.mode !== "day" || state.isCustomRange);

    var totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    for (var i = 0; i < totalCells; i++) {
      var cell = document.createElement("div");
      cell.className = "day-cell";
      var cellDateKey = "";
      var dayNum = 0;

      if (i < startOffset) {
        dayNum = prevMonthDays - startOffset + i + 1;
        var pm = state.viewMonth - 1;
        var py = state.viewYear;
        if (pm < 0) { pm = 11; py--; }
        cellDateKey = toKey(py, pm, dayNum);
        cell.classList.add("other-month");
      } else if (i >= startOffset + daysInMonth) {
        dayNum = i - (startOffset + daysInMonth) + 1;
        var nm = state.viewMonth + 1;
        var ny = state.viewYear;
        if (nm > 11) { nm = 0; ny++; }
        cellDateKey = toKey(ny, nm, dayNum);
        cell.classList.add("other-month");
      } else {
        dayNum = i - startOffset + 1;
        cellDateKey = toKey(state.viewYear, state.viewMonth, dayNum);
      }

      cell.dataset.date = cellDateKey;
      var numSpan = document.createElement("span");
      numSpan.textContent = dayNum;
      cell.appendChild(numSpan);

      if (state.dayOffs[cellDateKey]) {
        cell.classList.add("day-off");
        var off = document.createElement("span");
        off.className = "off-mark";
        off.textContent = "✕";
        cell.appendChild(off);
      }

      var hasRecs = state.records[cellDateKey] && state.records[cellDateKey].length > 0;
      if (hasRecs) {
        var bar = document.createElement("div");
        bar.className = "data-bar";
        cell.appendChild(bar);
      }

      if (showRangeHighlight && cellDateKey >= rng.start && cellDateKey <= rng.end) {
        cell.classList.add("in-range");
      }
      if (cellDateKey === state.selectedDate && !state.isCustomRange) {
        cell.classList.add("selected");
      } else if (state.isCustomRange && cellDateKey >= rng.start && cellDateKey <= rng.end) {
        cell.classList.add("selected");
      }

      cell.addEventListener("pointerdown", function(e) {
        var dk = this.dataset.date;
        state.isDragging = true;
        state.dragAnchor = dk;
        state.selectedDate = dk;
        state.isCustomRange = false;
        state.rangeStart = dk;
        state.rangeEnd = dk;
        var pDt = parseKey(dk);
        state.viewYear = pDt.getFullYear();
        state.viewMonth = pDt.getMonth();
        updateAll();
      });

      grid.appendChild(cell);
    }
  }

  document.addEventListener("pointermove", function(e) {
    if (!state.isDragging) return;
    var el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el) return;
    var cell = el.closest(".day-cell");
    if (cell && cell.dataset.date && cell.dataset.date !== state.rangeEnd) {
      state.rangeEnd = cell.dataset.date;
      if (state.rangeEnd !== state.dragAnchor) {
        state.isCustomRange = true;
      }
      renderCalendar();
      renderRecordsAndSummary();
    }
  });

  document.addEventListener("pointerup", function() {
    if (state.isDragging) {
      state.isDragging = false;
    }
  });

  function renderRecordsAndSummary() {
    var rng = getActiveRange();
    var dates = enumerateDates(rng.start, rng.end);
    var listEl = document.getElementById("recordsList");
    listEl.innerHTML = "";

    var totalBoxes = 0;
    var totalWeight = 0;
    var totalMoney = 0;

    dates.forEach(function(dk) {
      var recs = state.records[dk] || [];
      var isOff = !!state.dayOffs[dk];

      if (isOff) {
        var offRow = document.createElement("div");
        offRow.className = "rec-item";
        offRow.innerHTML = "<span><b>" + formatHumanDate(dk) + "</b> — <span style='color:var(--red);font-weight:700'>Выходной</span></span>";
        var delOff = document.createElement("span");
        delOff.className = "rec-del";
        delOff.textContent = "✕";
        delOff.onclick = function() {
          delete state.dayOffs[dk];
          state.undoStack.push({ type: "dayoff", date: dk });
          saveData();
          updateAll();
        };
        offRow.appendChild(delOff);
        listEl.appendChild(offRow);
      }

      recs.forEach(function(r, idx) {
        var rowWeight = r.boxes * r.weight;
        var rowSum = rowWeight * r.rate;
        totalBoxes += r.boxes;
        totalWeight += rowWeight;
        totalMoney += rowSum;

        var row = document.createElement("div");
        row.className = "rec-item";
        row.innerHTML = "<span><b>" + formatHumanDate(dk) + "</b>: " + r.boxes + " кор. × " + fmtWeight(r.weight) + " кг = <b>" + fmtWeight(rowWeight) + " кг</b> (" + fmtMoney(rowSum) + " ₽)</span>";
        var delBtn = document.createElement("span");
        delBtn.className = "rec-del";
        delBtn.textContent = "✕";
        delBtn.onclick = function() {
          var removed = state.records[dk].splice(idx, 1)[0];
          if (state.records[dk].length === 0) delete state.records[dk];
          state.undoStack.push({ type: "record", date: dk, item: removed });
          saveData();
          updateAll();
        };
        row.appendChild(delBtn);
        listEl.appendChild(row);
      });
    });

    if (listEl.children.length === 0) {
      var empty = document.createElement("div");
      empty.style.cssText = "text-align:center;color:var(--text-dim);font-size:11px;padding:4px 0;";
      empty.textContent = "Нет записей за выбранный период";
      listEl.appendChild(empty);
    }

    var titleMap = {
      day: "ЗАПИСИ (ДЕНЬ)",
      week: "ЗАПИСИ (НЕДЕЛЯ)",
      biweek: "ЗАПИСИ (2Х НЕДЕЛИ)",
      month: "ЗАПИСИ (МЕСЯЦ)",
      year: "ЗАПИСИ (ГОД)"
    };
    var sumMap = {
      day: "ИТОГ ЗА ДЕНЬ",
      week: "ИТОГ ЗА НЕДЕЛЮ",
      biweek: "ИТОГ ЗА 2 НЕДЕЛИ",
      month: "ИТОГ ЗА МЕСЯЦ",
      year: "ИТОГ ЗА ГОД"
    };

    if (state.isCustomRange && rng.start !== rng.end) {
      document.getElementById("recordsTitle").textContent = "ЗАПИСИ (" + formatShortDate(rng.start) + " – " + formatShortDate(rng.end) + ")";
      document.getElementById("summaryLabel").textContent = "ИТОГ ЗА ПЕРИОД";
    } else {
      document.getElementById("recordsTitle").textContent = titleMap[state.mode] || "ЗАПИСИ";
      document.getElementById("summaryLabel").textContent = sumMap[state.mode] || "ИТОГ";
    }

    document.getElementById("summaryVals").textContent = totalBoxes + " кор. • " + fmtWeight(totalWeight) + " кг";
    document.getElementById("summaryMoney").textContent = fmtMoney(totalMoney) + " ₽";
    document.getElementById("selectedDateLabel").textContent = formatHumanDate(state.selectedDate);

    var undoWrap = document.getElementById("undoWrap");
    if (state.undoStack.length > 0) {
      undoWrap.style.display = "flex";
      document.getElementById("btnUndo").textContent = "↩ Отменить удаление (" + state.undoStack.length + ")";
    } else {
      undoWrap.style.display = "none";
    }
  }

  function updateShiftPreview() {
    var b = cleanNum(document.getElementById("inpBoxes").value);
    var w = cleanNum(document.getElementById("inpWeight").value);
    var r = cleanNum(document.getElementById("inpRate").value);
    var tw = b * w;
    var tm = tw * r;
    document.getElementById("shiftWeight").textContent = fmtWeight(tw) + " кг";
    document.getElementById("shiftMoney").textContent = fmtMoney(tm) + " ₽";
  }

  function updateAll() {
    renderCalendar();
    renderRecordsAndSummary();
    updateShiftPreview();
  }

  document.getElementById("prevMonth").onclick = function() {
    state.viewMonth--;
    if (state.viewMonth < 0) { state.viewMonth = 11; state.viewYear--; }
    if (state.mode === "month" || state.mode === "year") {
      state.selectedDate = toKey(state.viewYear, state.viewMonth, 1);
      state.isCustomRange = false;
    }
    updateAll();
  };

  document.getElementById("nextMonth").onclick = function() {
    state.viewMonth++;
    if (state.viewMonth > 11) { state.viewMonth = 0; state.viewYear++; }
    if (state.mode === "month" || state.mode === "year") {
      state.selectedDate = toKey(state.viewYear, state.viewMonth, 1);
      state.isCustomRange = false;
    }
    updateAll();
  };

  document.querySelectorAll(".tab-btn").forEach(function(btn) {
    btn.onclick = function() {
      document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
      this.classList.add("active");
      state.mode = this.dataset.mode;
      state.isCustomRange = false;
      updateAll();
    };
  });

  document.getElementById("btnTheme").onclick = function() {
    document.body.classList.toggle("light");
    var isLight = document.body.classList.contains("light");
    this.textContent = isLight ? "🌙" : "☀️";
    safeSet(THEME_KEY, isLight ? "light" : "dark");
  };

  document.getElementById("btnCheckUpd").onclick = function() {
    showToast("Проверка обновлений...");
    if (navigator.onLine) {
      setTimeout(function() {
        window.location.reload(true);
      }, 400);
    } else {
      showToast("Нет интернета (версия v " + APP_VERSION + ")");
    }
  };

  document.getElementById("inpWorker").addEventListener("input", function() {
    safeSet(WORKER_KEY, this.value.trim());
  });

  ["inpBoxes", "inpWeight", "inpRate"].forEach(function(id) {
    document.getElementById(id).addEventListener("input", function() {
      if (id === "inpBoxes") {
        this.value = this.value.replace(/[^0-9]/g, "");
      } else {
        this.value = this.value.replace(",", ".").replace(/[^0-9.]/g, "");
      }
      if (id === "inpRate") safeSet(RATE_KEY, this.value);
      updateShiftPreview();
    });
  });

  document.getElementById("btnDayOff").onclick = function() {
    var dk = state.selectedDate;
    if (state.dayOffs[dk]) {
      delete state.dayOffs[dk];
    } else {
      state.dayOffs[dk] = true;
    }
    saveData();
    updateAll();
  };

  document.getElementById("btnAdd").onclick = function() {
    var b = cleanNum(document.getElementById("inpBoxes").value);
    var w = cleanNum(document.getElementById("inpWeight").value);
    var r = cleanNum(document.getElementById("inpRate").value);
    if (b <= 0 || w <= 0) {
      showToast("Введите коробки и вес");
      return;
    }
    var dk = state.selectedDate;
    if (!state.records[dk]) state.records[dk] = [];
    state.records[dk].push({ boxes: b, weight: w, rate: r, sum: b * w * r });
    delete state.dayOffs[dk];
    saveData();
    document.getElementById("inpBoxes").value = "";
    document.getElementById("inpWeight").value = "";
    updateAll();
  };

  document.getElementById("btnUndo").onclick = function() {
    if (state.undoStack.length === 0) return;
    var last = state.undoStack.pop();
    if (last.type === "dayoff") {
      state.dayOffs[last.date] = true;
    } else if (last.type === "record") {
      if (!state.records[last.date]) state.records[last.date] = [];
      state.records[last.date].push(last.item);
    }
    saveData();
    updateAll();
  };

  document.getElementById("btnClearUndo").onclick = function() {
    openConfirm("Все удаленные данные сотрутся. Вы уверены?", function() {
      state.undoStack = [];
      updateAll();
    });
  };

  function padRight(str, len) {
    str = String(str);
    while (str.length < len) str += " ";
    return str;
  }

  function buildFullReport() {
    var worker = document.getElementById("inpWorker").value.trim();
    var rng = getActiveRange();
    var dates = enumerateDates(rng.start, rng.end);
    var lines = [];

    if (worker) lines.push(worker);
    if (rng.start === rng.end) {
      lines.push(formatHumanDate(rng.start));
    } else {
      lines.push(formatShortDate(rng.start) + " – " + formatShortDate(rng.end));
    }

    var totB = 0, totW = 0, totM = 0;

    dates.forEach(function(dk) {
      var recs = state.records[dk] || [];
      var isOff = !!state.dayOffs[dk];
      if (isOff && recs.length === 0) {
        lines.push(padRight(formatShortDate(dk), 6) + " | вых");
      } else if (recs.length > 0) {
        var dB = 0, dW = 0, dM = 0;
        recs.forEach(function(r) {
          dB += r.boxes;
          dW += r.boxes * r.weight;
          dM += r.boxes * r.weight * r.rate;
        });
        totB += dB;
        totW += dW;
        totM += dM;
        lines.push(
          padRight(formatShortDate(dk), 6) + " | " +
          dB + "кор | " +
          fmtWeight(dW) + "кг | " +
          fmtMoney(dM) + "₽"
        );
      }
    });

    lines.push("ИТОГ: " + totB + "кор | " + fmtWeight(totW) + "кг | " + fmtMoney(totM) + "₽");
    return lines.join("\n");
  }

  function buildShortReport() {
    var worker = document.getElementById("inpWorker").value.trim();
    var rng = getActiveRange();
    var dates = enumerateDates(rng.start, rng.end);
    var totB = 0, totW = 0;

    dates.forEach(function(dk) {
      var recs = state.records[dk] || [];
      recs.forEach(function(r) {
        totB += r.boxes;
        totW += r.boxes * r.weight;
      });
    });

    var lines = [];
    if (worker) lines.push(worker);
    if (state.isCustomRange && rng.start !== rng.end) {
      lines.push(formatShortDate(rng.start) + " – " + formatShortDate(rng.end));
    }
    lines.push("Вес: " + fmtWeight(totW) + " кг " + totB + " кор.");
    return lines.join("\n");
  }

  function openReportPreview(title, text) {
    document.getElementById("reportModalTitle").textContent = title;
    document.getElementById("reportTextarea").value = text;
    document.getElementById("reportModal").style.display = "flex";
  }

  document.getElementById("btnFullRep").onclick = function() {
    openReportPreview("Полный отчёт", buildFullReport());
  };

  document.getElementById("btnShortRep").onclick = function() {
    openReportPreview("Краткий отчёт", buildShortReport());
  };

  document.getElementById("btnReportCancel").onclick = function() {
    document.getElementById("reportModal").style.display = "none";
  };

  document.getElementById("btnReportSend").onclick = function() {
    var text = document.getElementById("reportTextarea").value;
    document.getElementById("reportModal").style.display = "none";
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function() {});
    }
    if (navigator.share) {
      navigator.share({ text: text }).catch(function() {});
    } else {
      window.location.href = "https://t.me/share/url?url=&text=" + encodeURIComponent(text);
    }
  };

  function getBackups() {
    try {
      return JSON.parse(safeGet(BACKUPS_KEY, "[]")) || [];
    } catch (e) {
      return [];
    }
  }

  function setBackups(arr) {
    safeSet(BACKUPS_KEY, JSON.stringify(arr));
  }

  document.getElementById("btnSaveBackup").onclick = function() {
    var list = getBackups();
    var now = new Date();
    var stamp = pad2(now.getDate()) + "." + pad2(now.getMonth() + 1) + "." + now.getFullYear() + " " + pad2(now.getHours()) + ":" + pad2(now.getMinutes());
    var count = 0;
    Object.keys(state.records).forEach(function(k) { count += (state.records[k] || []).length; });
    list.unshift({
      id: Date.now(),
      date: stamp,
      count: count,
      records: state.records,
      dayOffs: state.dayOffs,
      worker: document.getElementById("inpWorker").value.trim(),
      rate: document.getElementById("inpRate").value.trim()
    });
    if (list.length > 8) list = list.slice(0, 8);
    setBackups(list);
    showToast("База сохранена (" + count + " зап.)");
  };

  function renderBackupList() {
    var list = getBackups();
    var box = document.getElementById("backupList");
    box.innerHTML = "";
    if (list.length === 0) {
      box.innerHTML = "<div style='text-align:center;color:var(--text-dim);padding:10px'>Нет сохранённых копий</div>";
      return;
    }
    list.forEach(function(item, idx) {
      var row = document.createElement("div");
      row.className = "backup-item";
      var cnt = typeof item.count === "number" ? item.count : 0;
      row.innerHTML = "<div><b>" + (item.date || "Копия") + "</b><br><span style='color:var(--text-dim);font-size:11px'>Записей: " + cnt + "</span></div>";

      var btns = document.createElement("div");
      btns.className = "backup-item-btns";

      var btnRest = document.createElement("button");
      btnRest.className = "btn-restore-sm";
      btnRest.textContent = "Восстановить";
      btnRest.onclick = function() {
        state.records = item.records || {};
        state.dayOffs = item.dayOffs || {};
        if (item.worker) {
          document.getElementById("inpWorker").value = item.worker;
          safeSet(WORKER_KEY, item.worker);
        }
        if (item.rate) {
          document.getElementById("inpRate").value = item.rate;
          safeSet(RATE_KEY, item.rate);
        }
        saveData();
        updateAll();
        document.getElementById("restoreModal").style.display = "none";
        showToast("База восстановлена");
      };

      var btnDel = document.createElement("button");
      btnDel.className = "btn-del-backup";
      btnDel.textContent = "✕";
      btnDel.onclick = function() {
        openConfirm("Удалить эту сохранённую базу? Вы уверены?", function() {
          var cur = getBackups();
          cur.splice(idx, 1);
          setBackups(cur);
          renderBackupList();
        });
      };

      btns.appendChild(btnRest);
      btns.appendChild(btnDel);
      row.appendChild(btns);
      box.appendChild(row);
    });
  }

  document.getElementById("btnOpenRestore").onclick = function() {
    renderBackupList();
    document.getElementById("restoreModal").style.display = "flex";
  };

  document.getElementById("btnCloseRestore").onclick = function() {
    document.getElementById("restoreModal").style.display = "none";
  };

  loadData();
  updateAll();
})();
</script>
</body>
</html>
