<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Обвалка PRO v 8.9</title>
<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --card-border: #2c2c2c;
    --text: #f3f4f6;
    --text-muted: #9ca3af;
    --accent-green: #16a34a;
    --accent-green-hover: #15803d;
    --accent-orange: #eab308;
    --accent-orange-bg: rgba(234, 179, 8, 0.18);
    --accent-red: #dc2626;
    --accent-red-bg: rgba(220, 38, 38, 0.16);
    --input-bg: #2a2a2a;
    --input-border: #3a3a3a;
    --cell-bg: #252525;
    --cell-border: #383838;
    --cell-other: #1a1a1a;
  }
  body.light {
    --bg: #f1f5f9;
    --card: #ffffff;
    --card-border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --accent-green: #16a34a;
    --accent-green-hover: #15803d;
    --accent-orange: #d97706;
    --accent-orange-bg: rgba(245, 158, 11, 0.22);
    --accent-red: #dc2626;
    --accent-red-bg: rgba(220, 38, 38, 0.12);
    --input-bg: #f8fafc;
    --input-border: #cbd5e1;
    --cell-bg: #f8fafc;
    --cell-border: #cbd5e1;
    --cell-other: #f1f5f9;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.3;
    padding: 6px;
    display: flex;
    justify-content: center;
  }
  .app-container {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 8px;
  }
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    gap: 4px;
  }
  .nav-btn {
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    width: 30px;
    height: 28px;
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .nav-btn:active {
    opacity: 0.7;
  }
  .month-title-wrap {
    display: flex;
    align-items: baseline;
    gap: 6px;
    justify-content: center;
    flex: 1;
  }
  .month-title {
    font-size: 16px;
    font-weight: 700;
  }
  .version-tag {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
  }
  .header-actions {
    display: flex;
    gap: 4px;
  }
  .icon-btn {
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    width: 28px;
    height: 28px;
    border-radius: 7px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .icon-btn:active {
    opacity: 0.7;
  }
  .period-tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .period-tab {
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text-muted);
    padding: 5px 2px;
    border-radius: 7px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    user-select: none;
  }
  .period-tab.active {
    background: var(--accent-green);
    border-color: var(--accent-green);
    color: #ffffff;
  }
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 3px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    user-select: none;
    touch-action: pan-y;
  }
  .day-cell {
    height: 27px;
    background: var(--cell-bg);
    border: 1px solid var(--cell-border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    color: var(--text);
  }
  .day-cell.other-month {
    background: var(--cell-other);
    color: var(--text-muted);
    opacity: 0.55;
  }
  .day-cell.in-range {
    background: var(--accent-orange-bg);
    border-color: var(--accent-orange);
    color: var(--text);
  }
  .day-cell.selected {
    background: var(--accent-orange);
    border-color: var(--accent-orange);
    color: #111827;
    font-weight: 800;
  }
  .day-cell.has-off {
    background: var(--accent-red-bg);
    border-color: rgba(220, 38, 38, 0.55);
  }
  .day-cell.has-off.selected {
    background: var(--accent-orange);
    border-color: var(--accent-red);
    color: #111827;
  }
  .day-num {
    line-height: 1;
    pointer-events: none;
  }
  .day-mark {
    position: absolute;
    bottom: 2px;
    width: 10px;
    height: 2px;
    border-radius: 2px;
    background: var(--accent-green);
    pointer-events: none;
  }
  .day-off-x {
    position: absolute;
    top: 1px;
    right: 2px;
    font-size: 8px;
    line-height: 1;
    color: var(--accent-red);
    font-weight: 900;
    pointer-events: none;
  }
  .cal-hint {
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    margin: 4px 0;
  }
  .btn-off-wide {
    width: 100%;
    height: 26px;
    background: rgba(220, 38, 38, 0.14);
    border: 1px solid rgba(220, 38, 38, 0.55);
    color: #ef4444;
    border-radius: 7px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    user-select: none;
  }
  .btn-off-wide:active {
    opacity: 0.75;
  }
  .section-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .undo-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    background: rgba(234, 179, 8, 0.15);
    border: 1px solid rgba(234, 179, 8, 0.45);
    border-radius: 7px;
    padding: 4px 8px;
    margin-bottom: 5px;
  }
  .undo-bar.visible {
    display: flex;
  }
  .btn-undo {
    background: var(--accent-orange);
    color: #111827;
    border: none;
    border-radius: 5px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-clear-undo {
    background: rgba(220, 38, 38, 0.2);
    color: #ef4444;
    border: 1px solid rgba(220, 38, 38, 0.45);
    border-radius: 5px;
    padding: 3px 7px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .summary-box {
    background: rgba(22, 163, 74, 0.12);
    border: 1px solid rgba(22, 163, 74, 0.35);
    border-radius: 9px;
    padding: 7px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }
  .summary-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .summary-label {
    font-size: 10px;
    font-weight: 700;
    color: #22c55e;
    text-transform: uppercase;
  }
  .summary-stats {
    font-size: 13px;
    font-weight: 700;
  }
  .summary-money {
    font-size: 18px;
    font-weight: 800;
    color: var(--accent-orange);
  }
  .report-btns {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 116px;
  }
  .btn-report-full {
    background: var(--accent-green);
    color: #ffffff;
    border: none;
    border-radius: 7px;
    padding: 6px 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .btn-report-short {
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--input-border);
    border-radius: 7px;
    padding: 5px 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  .records-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 150px;
    overflow-y: auto;
  }
  .record-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 6px;
    padding: 2px 6px;
    min-height: 22px;
    font-size: 11px;
  }
  .record-item.off-item {
    border-color: rgba(220, 38, 38, 0.45);
    background: rgba(220, 38, 38, 0.1);
    color: #f87171;
  }
  .record-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-right: 6px;
  }
  .record-money {
    color: var(--accent-orange);
    font-weight: 700;
  }
  .btn-del-rec {
    background: rgba(220, 38, 38, 0.2);
    border: 1px solid rgba(220, 38, 38, 0.45);
    color: #ef4444;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .form-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .form-date {
    font-weight: 700;
  }
  .form-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 5px;
    gap: 8px;
  }
  .form-row label {
    font-size: 12px;
    color: var(--text);
    flex: 1;
  }
  .form-row input {
    width: 140px;
    height: 30px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 7px;
    padding: 0 8px;
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    text-align: right;
  }
  .form-row input:focus {
    outline: none;
    border-color: var(--accent-green);
  }
  .shift-preview {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--input-bg);
    border-radius: 7px;
    padding: 6px 8px;
    margin-bottom: 6px;
    font-size: 12px;
    font-weight: 700;
  }
  .preview-vals {
    display: flex;
    gap: 8px;
  }
  .preview-kg {
    color: #22c55e;
  }
  .preview-rub {
    color: var(--accent-orange);
  }
  .btn-add-shift {
    width: 100%;
    height: 36px;
    background: var(--accent-green);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  .btn-add-shift:active {
    background: var(--accent-green-hover);
  }
  .bottom-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .btn-storage {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    height: 34px;
    border-radius: 9px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  .modal-backdrop.open {
    display: flex;
  }
  .modal-box {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    width: 100%;
    max-width: 400px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 85vh;
  }
  .modal-title {
    font-size: 15px;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .report-textarea {
    width: 100%;
    min-height: 150px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    padding: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
  }
  .modal-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .btn-cancel {
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    height: 36px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-send {
    background: var(--accent-green);
    border: none;
    color: #ffffff;
    height: 36px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .backups-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    overflow-y: auto;
    max-height: 240px;
  }
  .backup-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 7px;
    padding: 6px 8px;
    gap: 6px;
    font-size: 11px;
  }
  .backup-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }
  .backup-name {
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .backup-sub {
    color: var(--text-muted);
    font-size: 10px;
  }
  .backup-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .btn-bkp-load {
    background: var(--accent-green);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-bkp-del {
    background: rgba(220, 38, 38, 0.2);
    color: #ef4444;
    border: 1px solid rgba(220, 38, 38, 0.45);
    border-radius: 5px;
    padding: 4px 7px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .confirm-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .confirm-overlay.open {
    display: flex;
  }
  .toast {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: #111827;
    color: #f9fafb;
    border: 1px solid #374151;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    text-align: center;
    max-width: 90%;
  }
  .toast.show {
    opacity: 1;
  }
</style>
</head>
<body>
<div class="app-container">
  <div class="card">
    <div class="cal-header">
      <button type="button" class="nav-btn" data-action="prev-month">◀</button>
      <div class="month-title-wrap">
        <span class="month-title" id="monthTitle">Ноябрь 2026</span>
        <span class="version-tag" id="versionTag">v 8.9</span>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" data-action="update-app" title="Обновить">🔄</button>
        <button type="button" class="icon-btn" data-action="toggle-theme" id="themeBtn" title="Тема">☀️</button>
        <button type="button" class="nav-btn" data-action="next-month">▶</button>
      </div>
    </div>

    <div class="period-tabs" id="periodTabs">
      <button type="button" class="period-tab active" data-action="set-period" data-period="day">День</button>
      <button type="button" class="period-tab" data-action="set-period" data-period="week">Неделя</button>
      <button type="button" class="period-tab" data-action="set-period" data-period="2weeks">2х недели</button>
      <button type="button" class="period-tab" data-action="set-period" data-period="month">Месяц</button>
      <button type="button" class="period-tab" data-action="set-period" data-period="year">Год</button>
    </div>

    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>

    <div class="cal-grid" id="calGrid"></div>

    <div class="cal-hint">Нажмите на день или протяните пальцем для выбора периода</div>
    <button type="button" class="btn-off-wide" data-action="add-off">✕ ВЫХОДНОЙ</button>
  </div>

  <div class="card">
    <div class="section-top">
      <span id="recordsHeader">ЗАПИСИ (ДЕНЬ)</span>
      <span id="recordsCount">0 ШТ.</span>
    </div>

    <div class="undo-bar" id="undoBar">
      <button type="button" class="btn-undo" data-action="undo-delete" id="undoBtn">↩ Отменить удаление (0)</button>
      <button type="button" class="btn-clear-undo" data-action="ask-clear-undo">Очистить</button>
    </div>

    <div class="summary-box">
      <div class="summary-info">
        <div class="summary-label" id="summaryLabel">ИТОГ ЗА ДЕНЬ</div>
        <div class="summary-stats" id="summaryStats">0 кор. • 0 кг</div>
        <div class="summary-money" id="summaryMoney">0 ₽</div>
      </div>
      <div class="report-btns">
        <button type="button" class="btn-report-full" data-action="open-report" data-rtype="full">📋 Полный отчёт</button>
        <button type="button" class="btn-report-short" data-action="open-report" data-rtype="short">📄 Краткий отчёт</button>
      </div>
    </div>

    <div class="records-list" id="recordsList"></div>
  </div>

  <div class="card">
    <div class="form-header">
      <span style="color: var(--text-muted);">Выбрана дата:</span>
      <span class="form-date" id="selectedDateText">23 ноября</span>
    </div>
    <div class="form-row">
      <label for="workerName">Обвальщик:</label>
      <input type="text" id="workerName" placeholder="Имя">
    </div>
    <div class="form-row">
      <label for="boxesInput">Коробки (шт):</label>
      <input type="text" inputmode="numeric" id="boxesInput" placeholder="0">
    </div>
    <div class="form-row">
      <label for="boxWeightInput">Вес коробки (кг):</label>
      <input type="text" inputmode="decimal" id="boxWeightInput" placeholder="00.0">
    </div>
    <div class="form-row">
      <label for="rateInput">Ставка за 1 кг (₽):</label>
      <input type="text" inputmode="decimal" id="rateInput" placeholder="0.0">
    </div>
    <div class="shift-preview">
      <span>ИТОГО ЗА СМЕНУ:</span>
      <div class="preview-vals">
        <span class="preview-kg" id="previewKg">0 кг</span>
        <span class="preview-rub" id="previewRub">0 ₽</span>
      </div>
    </div>
    <button type="button" class="btn-add-shift" data-action="add-shift">+ ДОБАВИТЬ ЗАПИСЬ</button>
  </div>

  <div class="bottom-actions">
    <button type="button" class="btn-storage" data-action="save-backup">💾 СОХРАНИТЬ БАЗУ</button>
    <button type="button" class="btn-storage" data-action="open-backups">📂 ВОССТАНОВИТЬ</button>
  </div>
</div>

<!-- Окно предпросмотра отчёта -->
<div class="modal-backdrop" id="reportModal">
  <div class="modal-box">
    <div class="modal-title">
      <span>Предпросмотр отчёта</span>
    </div>
    <textarea class="report-textarea" id="reportTextarea"></textarea>
    <div class="modal-btns">
      <button type="button" class="btn-cancel" data-action="close-report">Отмена</button>
      <button type="button" class="btn-send" data-action="send-report">📤 Отправить</button>
    </div>
  </div>
</div>

<!-- Окно резервных копий и переноса -->
<div class="modal-backdrop" id="backupsModal">
  <div class="modal-box">
    <div class="modal-title">
      <span>Резервные копии</span>
      <button type="button" class="btn-bkp-load" data-action="toggle-transfer">🔑 Перенос / Код</button>
    </div>
    <div id="transferBox" style="display:none; flex-direction:column; gap:6px;">
      <textarea class="report-textarea" id="transferCodeInput" style="min-height:80px; font-size:11px;" placeholder="Вставьте сюда код базы для переноса..."></textarea>
      <div class="modal-btns">
        <button type="button" class="btn-cancel" data-action="copy-transfer">📋 Скопировать код</button>
        <button type="button" class="btn-send" data-action="import-transfer">📥 Загрузить код</button>
      </div>
    </div>
    <div class="backups-list" id="backupsList"></div>
    <button type="button" class="btn-cancel" data-action="close-backups">Закрыть</button>
  </div>
</div>

<!-- Окно подтверждения поверх -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="modal-box" style="max-width:320px;">
    <div class="modal-title" id="confirmTitle">Подтверждение</div>
    <div style="font-size:13px; color:var(--text-muted);" id="confirmMsg">Вы уверены?</div>
    <div class="modal-btns">
      <button type="button" class="btn-cancel" data-action="confirm-no">Отмена</button>
      <button type="button" class="btn-send" style="background:var(--accent-red);" data-action="confirm-yes">Удалить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js?v=8.9"></script>
</body>
</html>
