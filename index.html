<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Обвалка PRO v 7.7</title>
<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --card-border: #2c2c2c;
    --input-bg: #2a2a2a;
    --text: #f3f4f6;
    --text-muted: #9ca3af;
    --green: #16a34a;
    --green-hover: #15803d;
    --green-soft: rgba(22, 163, 74, 0.16);
    --yellow: #eab308;
    --yellow-text: #111827;
    --yellow-soft: rgba(234, 179, 8, 0.18);
    --red: #dc2626;
    --red-soft: rgba(220, 38, 38, 0.16);
    --day-border: #383838;
  }
  body.light {
    --bg: #f1f5f9;
    --card: #ffffff;
    --card-border: #e2e8f0;
    --input-bg: #f8fafc;
    --text: #0f172a;
    --text-muted: #64748b;
    --green: #16a34a;
    --green-hover: #15803d;
    --green-soft: rgba(22, 163, 74, 0.12);
    --yellow: #eab308;
    --yellow-text: #0f172a;
    --yellow-soft: rgba(234, 179, 8, 0.22);
    --red: #dc2626;
    --red-soft: rgba(220, 38, 38, 0.12);
    --day-border: #cbd5e1;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    margin: 0;
    padding: 8px;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 10px;
  }
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .nav-btn {
    width: 34px;
    height: 32px;
    border-radius: 9px;
    border: 1px solid var(--card-border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .month-title-wrap {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .month-title {
    font-size: 17px;
    font-weight: 700;
  }
  .ver-badge {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
  }
  .header-actions {
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    border: 1px solid var(--card-border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .period-tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    margin-bottom: 8px;
  }
  .tab-btn {
    padding: 6px 2px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--input-bg);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  .tab-btn.active {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    user-select: none;
    touch-action: pan-y;
  }
  .day-cell {
    height: 27px;
    border-radius: 7px;
    border: 1px solid var(--day-border);
    background: var(--input-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
  }
  .day-cell.other-month {
    opacity: 0.35;
  }
  .day-cell.in-range {
    background: var(--yellow-soft);
    border-color: rgba(234, 179, 8, 0.55);
  }
  .day-cell.selected {
    background: var(--yellow) !important;
    border-color: var(--yellow) !important;
    color: var(--yellow-text) !important;
    font-weight: 800;
  }
  .day-cell.is-off {
    background: var(--red-soft);
    border-color: rgba(220, 38, 38, 0.55);
    color: #f87171;
  }
  .day-cell.has-work::after {
    content: "";
    width: 12px;
    height: 2px;
    border-radius: 2px;
    background: var(--green);
    position: absolute;
    bottom: 2px;
  }
  .day-cell.selected.has-work::after {
    background: #111827;
  }
  .cal-hint {
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    margin: 6px 0 5px;
  }
  .off-btn {
    width: 100%;
    height: 25px;
    border-radius: 8px;
    border: 1px solid rgba(220, 38, 38, 0.5);
    background: var(--red-soft);
    color: #ef4444;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    cursor: pointer;
  }
  .sec-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .summary-box {
    background: var(--green-soft);
    border: 1px solid rgba(22, 163, 74, 0.35);
    border-radius: 10px;
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .sum-label {
    font-size: 10px;
    font-weight: 700;
    color: #4ade80;
    text-transform: uppercase;
  }
  body.light .sum-label {
    color: #15803d;
  }
  .sum-sub {
    font-size: 13px;
    font-weight: 700;
    margin-top: 2px;
  }
  .sum-money {
    font-size: 20px;
    font-weight: 800;
    color: var(--yellow);
    margin-top: 2px;
  }
  body.light .sum-money {
    color: #ca8a04;
  }
  .report-btns {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 122px;
  }
  .rep-btn-full {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .rep-btn-short {
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .records-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 6px;
  }
  .rec-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 12px;
  }
  .rec-item.off-row {
    border-color: rgba(220, 38, 38, 0.45);
    color: #f87171;
  }
  .rec-del {
    background: var(--red-soft);
    color: #ef4444;
    border: 1px solid rgba(220, 38, 38, 0.4);
    border-radius: 6px;
    width: 22px;
    height: 22px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .undo-bar {
    margin-top: 6px;
    background: var(--yellow);
    color: var(--yellow-text);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 700;
    display: none;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .form-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .form-row label {
    color: var(--text-muted);
    font-weight: 500;
  }
  .form-input {
    width: 56%;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 7px 10px;
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    text-align: right;
    outline: none;
  }
  .form-input:focus {
    border-color: var(--green);
  }
  .shift-preview {
    background: var(--input-bg);
    border-radius: 8px;
    padding: 7px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
    margin: 6px 0 8px;
  }
  .add-btn {
    width: 100%;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }
  .bottom-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .sec-btn {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 14px;
    z-index: 999;
  }
  .modal-box {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 10px;
  }
  .report-textarea {
    width: 100%;
    min-height: 150px;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px;
    color: var(--text);
    font-size: 13px;
    line-height: 1.4;
    resize: vertical;
  }
  .modal-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  .backup-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    border-radius: 9px;
    padding: 8px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: #111827;
    color: #fff;
    border: 1px solid #374151;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    z-index: 1200;
    display: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="cal-header">
      <button type="button" class="nav-btn" id="prevMonthBtn">◀</button>
      <div class="month-title-wrap">
        <span class="month-title" id="monthTitle">Ноябрь 2026</span>
        <span class="ver-badge" id="verBadge">v 7.7</span>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="updateBtn" title="Обновить">🔄</button>
        <button type="button" class="icon-btn" id="themeBtn" title="Тема">☀️</button>
        <button type="button" class="nav-btn" id="nextMonthBtn">▶</button>
      </div>
    </div>

    <div class="period-tabs" id="periodTabs">
      <button type="button" class="tab-btn active" data-period="day">День</button>
      <button type="button" class="tab-btn" data-period="week">Неделя</button>
      <button type="button" class="tab-btn" data-period="two_weeks">2х недели</button>
      <button type="button" class="tab-btn" data-period="month">Месяц</button>
      <button type="button" class="tab-btn" data-period="year">Год</button>
    </div>

    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>

    <div class="cal-grid" id="calGrid"></div>

    <div class="cal-hint">Нажмите на день или протяните пальцем для выбора периода</div>
    <button type="button" class="off-btn" id="dayOffBtn">✕ ВЫХОДНОЙ</button>
  </div>

  <div class="card">
    <div class="sec-head">
      <span id="recordsHeader">ЗАПИСИ (ДЕНЬ)</span>
      <span id="recordsCount">0 ШТ.</span>
    </div>

    <div class="summary-box">
      <div>
        <div class="sum-label" id="sumTitle">ИТОГ ЗА ДЕНЬ</div>
        <div class="sum-sub" id="sumWeight">0 кор. • 0 кг</div>
        <div class="sum-money" id="sumMoney">0 ₽</div>
      </div>
      <div class="report-btns">
        <button type="button" class="rep-btn-full" id="fullReportBtn">📋 Полный отчёт</button>
        <button type="button" class="rep-btn-short" id="shortReportBtn">📄 Краткий отчёт</button>
      </div>
    </div>

    <div class="records-list" id="recordsList"></div>

    <div class="undo-bar" id="undoBar">
      <span>↩ Вернуть удалённую запись</span>
      <span id="undoTimer">5 с</span>
    </div>
  </div>

  <div class="card">
    <div class="form-row">
      <label>Выбрана дата:</label>
      <strong id="selectedDateText" style="font-size:14px;">23 ноября</strong>
    </div>
    <div class="form-row">
      <label for="workerInput">Обвальщик:</label>
      <input type="text" id="workerInput" class="form-input" placeholder="Имя">
    </div>
    <div class="form-row">
      <label for="boxesInput">Коробки (шт):</label>
      <input type="text" inputmode="decimal" id="boxesInput" class="form-input" placeholder="0">
    </div>
    <div class="form-row">
      <label for="weightInput">Вес коробки (кг):</label>
      <input type="text" inputmode="decimal" id="weightInput" class="form-input" placeholder="00.0">
    </div>
    <div class="form-row">
      <label for="rateInput">Ставка за 1 кг (₽):</label>
      <input type="text" inputmode="decimal" id="rateInput" class="form-input" placeholder="0.0">
    </div>

    <div class="shift-preview">
      <span>ИТОГО ЗА СМЕНУ:</span>
      <span><span id="previewWeight" style="color:#22c55e;">0 кг</span> &nbsp;<span id="previewMoney" style="color:#eab308;">0 ₽</span></span>
    </div>

    <button type="button" class="add-btn" id="addRecordBtn">+ ДОБАВИТЬ ЗАПИСЬ</button>
  </div>

  <div class="bottom-btns">
    <button type="button" class="sec-btn" id="saveBackupBtn">💾 СОХРАНИТЬ БАЗУ</button>
    <button type="button" class="sec-btn" id="openRestoreBtn">📂 ВОССТАНОВИТЬ</button>
  </div>
</div>

<div class="modal-backdrop" id="reportModal">
  <div class="modal-box">
    <div class="modal-title">Предпросмотр отчёта</div>
    <textarea class="report-textarea" id="reportPreviewText"></textarea>
    <div class="modal-actions">
      <button type="button" class="rep-btn-short" id="closeReportBtn">Отмена</button>
      <button type="button" class="rep-btn-full" id="shareReportBtn">📤 Отправить</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="restoreModal">
  <div class="modal-box">
    <div class="modal-title">Резервные копии</div>
    <div id="backupsList"></div>
    <div style="margin-top:8px;border-top:1px solid var(--card-border);padding-top:8px;">
      <div style="font-size:12px;font-weight:700;margin-bottom:4px;">🔑 Перенос базы по коду:</div>
      <textarea class="report-textarea" id="transferCodeArea" style="min-height:64px;font-size:11px;" placeholder="Нажмите «Скопировать код» или вставьте сюда код с другого телефона"></textarea>
      <div class="modal-actions">
        <button type="button" class="rep-btn-short" id="copyCodeBtn">Скопировать код</button>
        <button type="button" class="rep-btn-full" id="importCodeBtn">Загрузить из кода</button>
      </div>
    </div>
    <button type="button" class="rep-btn-short" id="closeRestoreBtn" style="width:100%;margin-top:10px;">Закрыть</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js?v=7.7"></script>
</body>
</html>
