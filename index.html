<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Обвалка PRO v 5.1</title>
<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --accent: #00c853;
    --accent-dark: #009624;
    --yellow: #ffab00;
    --yellow-soft: rgba(255, 171, 0, 0.22);
    --text: #ffffff;
    --muted: #9e9e9e;
    --border: #333333;
    --input-border: #555555;
    --day-bg: #252525;
    --danger: #ff5252;
    --ver-color: #e0e0e0;
  }
  body.light-theme {
    --bg: #f2f3f5;
    --card: #ffffff;
    --text: #000000;
    --muted: #555555;
    --border: #cccccc;
    --input-border: #888888;
    --day-bg: #e8eaed;
    --yellow-soft: rgba(255, 171, 0, 0.35);
    --ver-color: #333333;
  }
  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0 auto;
    padding: 6px;
    background: var(--bg);
    color: var(--text);
    max-width: 500px;
    user-select: none;
  }
  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 6px;
    border: 1px solid var(--border);
  }
  .month-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .month-title-wrap {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  #monthLabel {
    font-size: 16px;
    font-weight: 700;
  }
  .ver-badge {
    font-size: 10px;
    font-weight: 500;
    color: var(--ver-color);
    letter-spacing: 0.2px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .nav-btn {
    background: var(--day-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 4px 10px;
    font-size: 14px;
    cursor: pointer;
  }
  .icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    cursor: pointer;
    padding: 0;
  }
  .update-btn {
    background: #1e88e5;
    color: #fff;
    border: none;
  }
  .theme-btn {
    background: #f0f0f0;
    color: #121212;
  }
  body.light-theme .theme-btn {
    background: #252525;
    color: #ffffff;
  }
  .tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .tab {
    background: var(--day-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 6px 2px;
    border-radius: 7px;
    font-weight: 600;
    font-size: 11px;
    cursor: pointer;
  }
  .tab.active {
    background: var(--accent);
    color: #000000;
    border-color: var(--accent);
  }
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    gap: 2px;
    margin-bottom: 2px;
  }
  .weekdays div {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }
  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    gap: 2px 3px;
    touch-action: none;
  }
  .day {
    padding: 3px 0;
    line-height: 1.2;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    background: var(--day-bg);
    color: var(--text);
    border: 1px solid transparent;
  }
  .day.empty {
    background: transparent;
    cursor: default;
  }
  .day.in-range {
    background: var(--yellow-soft);
    color: var(--text);
  }
  .day.selected {
    background: var(--yellow);
    color: #000000;
    font-weight: 800;
  }
  .day.day-off {
    border-color: var(--danger);
  }
  .day.day-off::before {
    content: '✕';
    position: absolute;
    top: 0px;
    right: 2px;
    font-size: 8px;
    color: var(--danger);
    font-weight: bold;
  }
  .day.has-data::after {
    content: '';
    position: absolute;
    bottom: 1px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 2px;
    border-radius: 1px;
    background: var(--accent);
  }
  .day.selected.has-data::after {
    background: #000000;
  }
  .hint-line {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }
  .records-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
    min-height: 20px;
  }
  .records-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
  }
  .undo-wrap {
    display: none;
    align-items: center;
    gap: 4px;
  }
  .undo-btn {
    background: var(--yellow);
    color: #000000;
    border: none;
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .clear-undo-btn {
    background: var(--danger);
    color: #ffffff;
    border: none;
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .record-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 0;
    line-height: 1.15;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .record-item:last-child {
    border-bottom: none;
  }
  .del-btn {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 11px;
    cursor: pointer;
  }
  .summary-box {
    background: #1b2e20;
    border: 1px solid var(--accent);
    padding: 8px 10px;
    border-radius: 10px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  body.light-theme .summary-box {
    background: #e8f5e9;
  }
  .summary-left {
    flex: 1;
  }
  .summary-title {
    font-size: 11px;
    color: #a5d6a7;
    font-weight: 700;
    margin-bottom: 2px;
    text-transform: uppercase;
  }
  body.light-theme .summary-title {
    color: #1b5e20;
  }
  .summary-stats {
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 5px;
  }
  .salary-highlight {
    color: var(--yellow);
    font-size: 18px;
    font-weight: 800;
  }
  body.light-theme .salary-highlight {
    color: #d87a00;
  }
  .report-btns {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .rep-btn {
    border: none;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    text-align: center;
  }
  .rep-full {
    background: var(--accent);
    color: #000000;
  }
  .rep-short {
    background: #2c2c2c;
    color: #ffffff;
    border: 1px solid #444;
  }
  body.light-theme .rep-short {
    background: #ffffff;
    color: #000000;
    border: 1px solid #999;
  }
  .input-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .input-row label {
    font-size: 14px;
    font-weight: 600;
  }
  .input-row input {
    width: 115px;
    height: 30px;
    padding: 0 10px;
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    line-height: 28px;
    text-align: right;
    border-radius: 7px;
    border: 1px solid var(--input-border);
    background: var(--bg);
    color: var(--text);
    -webkit-appearance: none;
    -moz-appearance: textfield;
    appearance: none;
  }
  .input-row input::-webkit-outer-spin-button,
  .input-row input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .preview-sum {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 10px;
    background: var(--day-bg);
    border: 1px solid var(--input-border);
    border-radius: 7px;
    margin: 5px 0;
    font-size: 13px;
    font-weight: 600;
  }
  .preview-right {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .preview-weight {
    color: var(--accent);
    font-weight: 700;
    font-size: 14px;
  }
  .preview-pay {
    color: var(--yellow);
    font-weight: 800;
    font-size: 16px;
  }
  body.light-theme .preview-pay {
    color: #d87a00;
  }
  .action-btns {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 6px;
  }
  .off-btn {
    padding: 8px 4px;
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .add-btn {
    padding: 8px 6px;
    background: var(--accent);
    color: #000000;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }
  .backup-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .backup-btn {
    padding: 7px 6px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.top-modal {
    z-index: 2000;
  }
  .modal-box {
    background: var(--card);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    padding: 14px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .modal-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .modal-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }
  .btn-yes {
    background: var(--danger);
    color: #fff;
    border: none;
    padding: 8px;
    border-radius: 7px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-no {
    background: var(--day-bg);
    color: var(--text);
    border: 1px solid var(--input-border);
    padding: 8px;
    border-radius: 7px;
    font-weight: 700;
    cursor: pointer;
  }
  .backup-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 8px;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    margin-bottom: 6px;
    text-align: left;
    gap: 6px;
  }
  .backup-item-actions {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .restore-item-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .del-backup-btn {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .toast {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: #323232;
    color: #fff;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    z-index: 3000;
    display: none;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="month-header">
      <button class="nav-btn" onclick="changeMonth(-1)">&#9664;</button>
      <div class="month-title-wrap">
        <span id="monthLabel">Ноябрь 2026</span>
        <span class="ver-badge">v 5.1</span>
      </div>
      <div class="header-right">
        <button class="icon-btn update-btn" title="Проверить обновление" onclick="checkOnlineUpdate(true)">🔄</button>
        <button class="icon-btn theme-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
        <button class="nav-btn" onclick="changeMonth(1)">&#9654;</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-day" onclick="setMode('day')">День</button>
      <button class="tab" id="tab-week" onclick="setMode('week')">Неделя</button>
      <button class="tab" id="tab-two_weeks" onclick="setMode('two_weeks')">2х недели</button>
      <button class="tab" id="tab-month" onclick="setMode('month')">Месяц</button>
      <button class="tab" id="tab-year" onclick="setMode('year')">Год</button>
    </div>

    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div class="days-grid" id="calendarGrid"></div>
    <div class="hint-line">Нажмите на день или протяните пальцем для выбора периода</div>

    <div style="border-top: 1px solid var(--border); margin-top: 6px; padding-top: 5px;">
      <div class="records-header">
        <span class="records-title" id="recordsTitle">ЗАПИСИ (ДЕНЬ)</span>
        <div class="undo-wrap" id="undoWrap">
          <button class="undo-btn" id="undoBtn" onclick="undoDelete()">↩ Отменить удаление (0)</button>
          <button class="clear-undo-btn" onclick="askClearUndo()">✕</button>
        </div>
      </div>
      <div id="recordsList"></div>
    </div>
  </div>

  <div class="summary-box">
    <div class="summary-left">
      <div class="summary-title" id="summaryTitle">ИТОГ ЗА ДЕНЬ</div>
      <div class="summary-stats" id="summaryStats">0 кор. | 0 кг <span class="salary-highlight">0 ₽</span></div>
    </div>
    <div class="report-btns">
      <button class="rep-btn rep-full" onclick="shareFullReport()">📤 Полный отчёт</button>
      <button class="rep-btn rep-short" onclick="shareShortReport()">📋 Краткий отчёт</button>
    </div>
  </div>

  <div class="card">
    <div style="font-size: 11px; color: var(--muted); margin-bottom: 5px;" id="selectedDateLabel"></div>

    <div class="input-row">
      <label for="boxCount">Коробки (шт):</label>
      <input type="text" id="boxCount" inputmode="numeric" placeholder="0" oninput="sanitizeInt(this); calcPreview()">
    </div>

    <div class="input-row">
      <label for="boxWeight">Вес коробки (кг):</label>
      <input type="text" id="boxWeight" inputmode="decimal" placeholder="00.0" oninput="sanitizeDec(this); calcPreview()">
    </div>

    <div class="input-row">
      <label for="ratePerKg">Ставка за 1 кг (₽):</label>
      <input type="text" id="ratePerKg" inputmode="decimal" placeholder="0.0" oninput="sanitizeDec(this); saveRate(); calcPreview()">
    </div>

    <div class="preview-sum">
      <span>ИТОГО ЗА СМЕНУ:</span>
      <div class="preview-right">
        <span class="preview-weight" id="previewWeight">0 кг</span>
        <span class="preview-pay" id="previewPay">0 ₽</span>
      </div>
    </div>

    <div class="action-btns">
      <button class="off-btn" onclick="toggleDayOff()">✕ ВЫХОДНОЙ</button>
      <button class="add-btn" onclick="addRecord()">+ ДОБАВИТЬ ЗАПИСЬ</button>
    </div>
  </div>

  <div class="backup-row">
    <button class="backup-btn" onclick="saveLocalBackup()">💾 СОХРАНИТЬ БАЗУ</button>
    <button class="backup-btn" onclick="openRestoreModal()">📂 ВОССТАНОВИТЬ</button>
  </div>

  <div class="modal-overlay top-modal" id="confirmModal">
    <div class="modal-box">
      <div class="modal-title" id="confirmText">Все удаленные данные сотрутся.<br>Вы уверены?</div>
      <div class="modal-actions">
        <button class="btn-yes" id="confirmYesBtn">Да</button>
        <button class="btn-no" onclick="closeConfirmModal()">Нет</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="restoreModal">
    <div class="modal-box">
      <div class="modal-title">Сохранённые копии в телефоне</div>
      <div id="backupListContainer" style="max-height: 240px; overflow-y: auto;"></div>
      <button class="btn-no" style="width: 100%; margin-top: 8px;" onclick="closeRestoreModal()">Закрыть</button>
    </div>
  </div>

  <div class="toast" id="toastBox"></div>

<script>
  var APP_VERSION = 5.1;
  var memStore = {};

  function safeGet(key, defVal) {
    try {
      var v = localStorage.getItem(key);
      return v !== null ? v : (memStore[key] || defVal);
    } catch (e) {
      return memStore[key] || defVal;
    }
  }

  function safeSet(key, val) {
    memStore[key] = val;
    try {
      localStorage.setItem(key, val);
    } catch (e) {}
  }

  function showToast(msg) {
    var t = document.getElementById('toastBox');
    t.innerText = msg;
    t.style.display = 'block';
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(function() {
      t.style.display = 'none';
    }, 2400);
  }

  var monthsNom = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var monthsGen = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var monthsShort = ['янв','фев','март','апр','май','июнь','июль','авг','сен','окт','ноя','дек'];

  var selectedDate = new Date();
  var viewDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
  var periodMode = 'day';
  var customStart = null;
  var customEnd = null;
  var isDragging = false;
  var dragStartKey = null;

  var records = [];
  var dayOffs = [];
  var undoStack = [];
  var confirmCallback = null;

  function loadData() {
    try {
      var rawRec = JSON.parse(safeGet('obvalka_records', '[]'));
      if (Array.isArray(rawRec)) {
        records = rawRec.filter(function(r) {
          return r && typeof r.date === 'string' && !isNaN(Number(r.count)) && Number(r.count) > 0 && !isNaN(Number(r.weightKg)) && Number(r.weightKg) > 0;
        }).map(function(r) {
          var c = Number(r.count);
          var w = Number(r.weightKg);
          var rt = isNaN(Number(r.rate)) ? 0 : Number(r.rate);
          var totW = Math.round(c * w * 1000) / 1000;
          var totP = Math.round(totW * rt * 100) / 100;
          return {
            id: r.id || (Date.now() + Math.random()),
            date: r.date,
            count: c,
            weightKg: w,
            rate: rt,
            totalWeight: totW,
            totalPay: totP
          };
        });
      }
    } catch (e) {
      records = [];
    }

    try {
      var rawOff = JSON.parse(safeGet('obvalka_dayoffs', '[]'));
      if (Array.isArray(rawOff)) {
        dayOffs = rawOff.filter(function(d) { return typeof d === 'string'; });
      }
    } catch (e) {
      dayOffs = [];
    }

    var savedRate = safeGet('obvalka_rate', '');
    if (savedRate && !isNaN(parseFloat(savedRate))) {
      document.getElementById('ratePerKg').value = savedRate;
    }

    if (safeGet('obvalka_theme', 'dark') === 'light') {
      document.body.classList.add('light-theme');
      document.getElementById('themeBtn').innerText = '🌙';
    }
  }

  function persistData() {
    safeSet('obvalka_records', JSON.stringify(records));
    safeSet('obvalka_dayoffs', JSON.stringify(dayOffs));
    mirrorToIDB();
  }

  function mirrorToIDB() {
    try {
      var req = indexedDB.open('ObvalkaProDB', 1);
      req.onupgradeneeded = function(ev) {
        var db = ev.target.result;
        if (!db.objectStoreNames.contains('state')) {
          db.createObjectStore('state');
        }
      };
      req.onsuccess = function(ev) {
        var db = ev.target.result;
        var tx = db.transaction('state', 'readwrite');
        tx.objectStore('state').put({
          records: records,
          dayOffs: dayOffs,
          rate: document.getElementById('ratePerKg').value
        }, 'latest');
      };
    } catch (e) {}
  }

  function sanitizeInt(el) {
    el.value = el.value.replace(/[^0-9]/g, '');
  }

  function sanitizeDec(el) {
    var v = el.value.replace(/,/g, '.').replace(/[^0-9.]/g, '');
    var parts = v.split('.');
    if (parts.length > 2) {
      v = parts[0] + '.' + parts.slice(1).join('');
    }
    el.value = v;
  }

  function parseNum(val) {
    if (!val) return 0;
    var n = parseFloat(String(val).replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }

  function fmtWeight(w) {
    var r = Math.round(w * 1000) / 1000;
    return r + ' кг';
  }

  function fmtMoney(m) {
    var r = Math.round(m * 100) / 100;
    return r.toLocaleString('ru-RU') + ' ₽';
  }

  function formatDateKey(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function parseDateKey(key) {
    var p = key.split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }

  function formatHumanDate(key) {
    var d = parseDateKey(key);
    return d.getDate() + ' ' + monthsGen[d.getMonth()];
  }

  function formatReportDate(key) {
    var d = parseDateKey(key);
    return d.getDate() + ' ' + monthsShort[d.getMonth()];
  }

  function saveRate() {
    var val = document.getElementById('ratePerKg').value;
    safeSet('obvalka_rate', val);
  }

  function calcPreview() {
    var count = parseInt(document.getElementById('boxCount').value, 10) || 0;
    var weight = parseNum(document.getElementById('boxWeight').value);
    var rate = parseNum(document.getElementById('ratePerKg').value);
    var totW = Math.round(count * weight * 1000) / 1000;
    var totP = Math.round(totW * rate * 100) / 100;
    document.getElementById('previewWeight').innerText = fmtWeight(totW);
    document.getElementById('previewPay').innerText = fmtMoney(totP);
  }

  function addRecord() {
    var count = parseInt(document.getElementById('boxCount').value, 10) || 0;
    var weight = parseNum(document.getElementById('boxWeight').value);
    var rate = parseNum(document.getElementById('ratePerKg').value);
    if (count <= 0 || weight <= 0) {
      showToast('Введите коробки и вес');
      return;
    }
    var key = formatDateKey(selectedDate);
    dayOffs = dayOffs.filter(function(d) { return d !== key; });
    var totW = Math.round(count * weight * 1000) / 1000;
    var totP = Math.round(totW * rate * 100) / 100;
    records.push({
      id: Date.now() + Math.random(),
      date: key,
      count: count,
      weightKg: weight,
      rate: rate,
      totalWeight: totW,
      totalPay: totP
    });
    persistData();
    document.getElementById('boxCount').value = '';
    document.getElementById('boxWeight').value = '';
    calcPreview();
    renderAll();
    showToast('Запись добавлена');
  }

  function toggleDayOff() {
    var key = formatDateKey(selectedDate);
    var idx = dayOffs.indexOf(key);
    if (idx !== -1) {
      dayOffs.splice(idx, 1);
      showToast('Выходной снят');
    } else {
      dayOffs.push(key);
      showToast('Отмечен выходной');
    }
    persistData();
    renderAll();
  }

  function deleteRecord(id) {
    var idx = -1;
    for (var i = 0; i < records.length; i++) {
      if (records[i].id === id) { idx = i; break; }
    }
    if (idx !== -1) {
      undoStack.push({ type: 'record', item: records[idx] });
      records.splice(idx, 1);
      persistData();
      renderAll();
    }
  }

  function deleteDayOff(key) {
    var idx = dayOffs.indexOf(key);
    if (idx !== -1) {
      undoStack.push({ type: 'dayoff', item: key });
      dayOffs.splice(idx, 1);
      persistData();
      renderAll();
    }
  }

  function undoDelete() {
    if (undoStack.length === 0) return;
    var last = undoStack.pop();
    if (last.type === 'record') {
      records.push(last.item);
    } else if (last.type === 'dayoff') {
      if (dayOffs.indexOf(last.item) === -1) dayOffs.push(last.item);
    }
    persistData();
    renderAll();
  }

  function askClearUndo() {
    openConfirm('Все удаленные данные сотрутся.<br>Вы уверены?', function() {
      undoStack = [];
      renderUndoBar();
    });
  }

  function renderUndoBar() {
    var wrap = document.getElementById('undoWrap');
    var btn = document.getElementById('undoBtn');
    if (undoStack.length > 0) {
      wrap.style.display = 'flex';
      btn.innerText = '↩ Отменить удаление (' + undoStack.length + ')';
    } else {
      wrap.style.display = 'none';
    }
  }

  function getActiveRange() {
    if (periodMode === 'custom' && customStart && customEnd) {
      return customStart <= customEnd ? { start: customStart, end: customEnd } : { start: customEnd, end: customStart };
    }
    var y = selectedDate.getFullYear();
    var m = selectedDate.getMonth();
    var d = selectedDate.getDate();
    if (periodMode === 'day') {
      var k = formatDateKey(selectedDate);
      return { start: k, end: k };
    }
    if (periodMode === 'week') {
      var dow = selectedDate.getDay();
      var diff = d - dow + (dow === 0 ? -6 : 1);
      var s = new Date(y, m, diff);
      var e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6);
      return { start: formatDateKey(s), end: formatDateKey(e) };
    }
    if (periodMode === 'two_weeks') {
      var lastDay = new Date(y, m + 1, 0).getDate();
      if (d <= 15) {
        return { start: formatDateKey(new Date(y, m, 1)), end: formatDateKey(new Date(y, m, 15)) };
      } else {
        return { start: formatDateKey(new Date(y, m, 16)), end: formatDateKey(new Date(y, m, lastDay)) };
      }
    }
    if (periodMode === 'month') {
      var lastM = new Date(y, m + 1, 0).getDate();
      return { start: formatDateKey(new Date(y, m, 1)), end: formatDateKey(new Date(y, m, lastM)) };
    }
    if (periodMode === 'year') {
      return { start: y + '-01-01', end: y + '-12-31' };
    }
    var defK = formatDateKey(selectedDate);
    return { start: defK, end: defK };
  }

  function setMode(mode) {
    periodMode = mode;
    customStart = null;
    customEnd = null;
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
    var activeTab = document.getElementById('tab-' + mode);
    if (activeTab) activeTab.classList.add('active');
    renderAll();
  }

  function changeMonth(delta) {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + delta, 1);
    if (periodMode === 'month' || periodMode === 'year') {
      var lastDay = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
      var targetDay = Math.min(selectedDate.getDate(), lastDay);
      selectedDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), targetDay);
    }
    renderAll();
  }

  function renderCalendar() {
    var year = viewDate.getFullYear();
    var month = viewDate.getMonth();
    document.getElementById('monthLabel').innerText = monthsNom[month] + ' ' + year;

    var grid = document.getElementById('calendarGrid');
    while (grid.firstChild) {
      grid.removeChild(grid.firstChild);
    }

    var firstDay = new Date(year, month, 1).getDay();
    var offset = firstDay === 0 ? 6 : firstDay - 1;
    var daysInMonth = new Date(year, month + 1, 0).getDate();

    var dataSet = {};
    for (var i = 0; i < records.length; i++) dataSet[records[i].date] = true;
    var offSet = {};
    for (var j = 0; j < dayOffs.length; j++) offSet[dayOffs[j]] = true;

    var selKey = formatDateKey(selectedDate);
    var range = getActiveRange();

    for (var e = 0; e < offset; e++) {
      var emptyDiv = document.createElement('div');
      emptyDiv.className = 'day empty';
      grid.appendChild(emptyDiv);
    }

    for (var d = 1; d <= daysInMonth; d++) {
      var curDate = new Date(year, month, d);
      var key = formatDateKey(curDate);
      var cell = document.createElement('div');
      var cls = 'day';
      if (periodMode !== 'day' && key >= range.start && key <= range.end) {
        cls += ' in-range';
      }
      if (key === selKey) {
        cls += ' selected';
      }
      if (offSet[key]) {
        cls += ' day-off';
      }
      if (dataSet[key]) {
        cls += ' has-data';
      }
      cell.className = cls;
      cell.innerText = String(d);
      cell.setAttribute('data-key', key);

      (function(k, yVal, mVal, dVal) {
        cell.addEventListener('pointerdown', function(ev) {
          ev.preventDefault();
          isDragging = true;
          dragStartKey = k;
          selectedDate = new Date(yVal, mVal, dVal);
          if (periodMode === 'custom') {
            periodMode = 'day';
            var tabs = document.querySelectorAll('.tab');
            for (var t = 0; t < tabs.length; t++) tabs[t].classList.remove('active');
            document.getElementById('tab-day').classList.add('active');
          }
          customStart = null;
          customEnd = null;
          renderAll();
        });
      })(key, year, month, d);

      grid.appendChild(cell);
    }
  }

  document.addEventListener('pointermove', function(ev) {
    if (!isDragging) return;
    var el = document.elementFromPoint(ev.clientX, ev.clientY);
    if (el && el.getAttribute && el.getAttribute('data-key')) {
      var hoverKey = el.getAttribute('data-key');
      if (hoverKey !== dragStartKey) {
        periodMode = 'custom';
        customStart = dragStartKey;
        customEnd = hoverKey;
        var tabs = document.querySelectorAll('.tab');
        for (var t = 0; t < tabs.length; t++) tabs[t].classList.remove('active');
        renderAll();
      }
    }
  });

  document.addEventListener('pointerup', function() {
    isDragging = false;
  });

  function renderSummaryAndList() {
    var selKey = formatDateKey(selectedDate);
    document.getElementById('selectedDateLabel').innerText = 'Выбрано: ' + formatHumanDate(selKey);

    var range = getActiveRange();
    var periodTitle = '';
    if (periodMode === 'day') {
      periodTitle = 'ДЕНЬ (' + formatHumanDate(selKey) + ')';
    } else if (periodMode === 'week') {
      periodTitle = 'НЕДЕЛЯ (' + formatHumanDate(range.start) + ' – ' + formatHumanDate(range.end) + ')';
    } else if (periodMode === 'two_weeks') {
      periodTitle = '2Х НЕДЕЛИ (' + formatHumanDate(range.start) + ' – ' + formatHumanDate(range.end) + ')';
    } else if (periodMode === 'month') {
      periodTitle = 'МЕСЯЦ (' + monthsNom[selectedDate.getMonth()].toUpperCase() + ' ' + selectedDate.getFullYear() + ')';
    } else if (periodMode === 'year') {
      periodTitle = 'ГОД (' + selectedDate.getFullYear() + ')';
    } else {
      periodTitle = 'ПЕРИОД (' + formatHumanDate(range.start) + ' – ' + formatHumanDate(range.end) + ')';
    }

    document.getElementById('recordsTitle').innerText = 'ЗАПИСИ (' + periodTitle + ')';
    document.getElementById('summaryTitle').innerText = 'ИТОГ ЗА ' + periodTitle;

    var filteredRecs = records.filter(function(r) {
      return r.date >= range.start && r.date <= range.end;
    });
    var filteredOffs = dayOffs.filter(function(d) {
      return d >= range.start && d <= range.end;
    });

    var totBoxes = 0;
    var totWeight = 0;
    var totPay = 0;
    for (var i = 0; i < filteredRecs.length; i++) {
      totBoxes += filteredRecs[i].count;
      totWeight += filteredRecs[i].totalWeight;
      totPay += filteredRecs[i].totalPay;
    }

    document.getElementById('summaryStats').innerHTML =
      totBoxes + ' кор. | ' + fmtWeight(totWeight) + ' <span class="salary-highlight">' + fmtMoney(totPay) + '</span>';

    var listEl = document.getElementById('recordsList');
    while (listEl.firstChild) {
      listEl.removeChild(listEl.firstChild);
    }

    var combined = [];
    for (var rIdx = 0; rIdx < filteredRecs.length; rIdx++) {
      combined.push({ kind: 'rec', date: filteredRecs[rIdx].date, data: filteredRecs[rIdx] });
    }
    for (var oIdx = 0; oIdx < filteredOffs.length; oIdx++) {
      combined.push({ kind: 'off', date: filteredOffs[oIdx], data: filteredOffs[oIdx] });
    }

    combined.sort(function(a, b) {
      return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);
    });

    if (combined.length === 0) {
      var emptyMsg = document.createElement('div');
      emptyMsg.style.fontSize = '11px';
      emptyMsg.style.color = 'var(--muted)';
      emptyMsg.innerText = 'Записей за выбранный период нет';
      listEl.appendChild(emptyMsg);
    } else {
      for (var cIdx = 0; cIdx < combined.length; cIdx++) {
        var entry = combined[cIdx];
        var row = document.createElement('div');
        row.className = 'record-item';

        var leftSpan = document.createElement('span');
        var btn = document.createElement('button');
        btn.className = 'del-btn';
        btn.innerText = '✕';

        if (entry.kind === 'rec') {
          var rec = entry.data;
          leftSpan.innerText = formatHumanDate(rec.date) + ': ' + rec.count + ' кор × ' + rec.weightKg + ' = ' + fmtWeight(rec.totalWeight) + ' (' + fmtMoney(rec.totalPay) + ')';
          (function(idVal) {
            btn.onclick = function() { deleteRecord(idVal); };
          })(rec.id);
        } else {
          leftSpan.style.color = 'var(--danger)';
          leftSpan.innerText = formatHumanDate(entry.date) + ': Выходной';
          (function(kVal) {
            btn.onclick = function() { deleteDayOff(kVal); };
          })(entry.date);
        }

        row.appendChild(leftSpan);
        row.appendChild(btn);
        listEl.appendChild(row);
      }
    }

    renderUndoBar();
  }

  function renderAll() {
    renderCalendar();
    renderSummaryAndList();
  }

  function padRight(str, len) {
    while (str.length < len) str += ' ';
    return str;
  }

  function shareText(txt) {
    if (navigator.share) {
      navigator.share({ text: txt }).catch(function() {});
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function() {
        showToast('Отчёт скопирован');
      }).catch(function() {
        alert(txt);
      });
    } else {
      alert(txt);
    }
  }

  function shareFullReport() {
    var range = getActiveRange();
    var title = document.getElementById('summaryTitle').innerText;
    var byDate = {};

    for (var i = 0; i < records.length; i++) {
      var r = records[i];
      if (r.date >= range.start && r.date <= range.end) {
        if (!byDate[r.date]) byDate[r.date] = { boxes: 0, weight: 0, pay: 0, off: false };
        byDate[r.date].boxes += r.count;
        byDate[r.date].weight += r.totalWeight;
        byDate[r.date].pay += r.totalPay;
      }
    }
    for (var j = 0; j < dayOffs.length; j++) {
      var d = dayOffs[j];
      if (d >= range.start && d <= range.end) {
        if (!byDate[d]) byDate[d] = { boxes: 0, weight: 0, pay: 0, off: true };
        else byDate[d].off = true;
      }
    }

    var keys = Object.keys(byDate).sort();
    var lines = [title];
    var totB = 0, totW = 0, totP = 0;

    for (var k = 0; k < keys.length; k++) {
      var dt = keys[k];
      var item = byDate[dt];
      var dStr = padRight(formatReportDate(dt), 7);
      if (item.off && item.boxes === 0) {
        lines.push(dStr + ' | вых');
      } else {
        totB += item.boxes;
        totW += item.weight;
        totP += item.pay;
        var bStr = padRight(item.boxes + ' к', 5);
        var wStr = padRight((Math.round(item.weight * 1000) / 1000) + ' кг', 9);
        var pStr = Math.round(item.pay) + ' ₽';
        lines.push(dStr + ' | ' + bStr + ' | ' + wStr + ' | ' + pStr);
      }
    }

    lines.push('------------------------');
    lines.push('ИТОГ: ' + totB + ' кор | ' + (Math.round(totW * 1000) / 1000) + ' кг | ' + Math.round(totP) + ' ₽');
    shareText(lines.join('\n'));
  }

  function shareShortReport() {
    var range = getActiveRange();
    var filteredRecs = records.filter(function(r) {
      return r.date >= range.start && r.date <= range.end;
    });
    var totW = 0;
    for (var i = 0; i < filteredRecs.length; i++) totW += filteredRecs[i].totalWeight;
    var periodText = formatHumanDate(range.start) + ' – ' + formatHumanDate(range.end);
    if (range.start === range.end) periodText = formatHumanDate(range.start);
    var txt = periodText + '\nОбщий вес: ' + (Math.round(totW * 1000) / 1000) + ' кг';
    shareText(txt);
  }

  function toggleTheme() {
    var isLight = document.body.classList.toggle('light-theme');
    document.getElementById('themeBtn').innerText = isLight ? '🌙' : '☀️';
    safeSet('obvalka_theme', isLight ? 'light' : 'dark');
  }

  function openConfirm(htmlMsg, onYes) {
    document.getElementById('confirmText').innerHTML = htmlMsg;
    confirmCallback = onYes;
    document.getElementById('confirmModal').style.display = 'flex';
  }

  function closeConfirmModal() {
    document.getElementById('confirmModal').style.display = 'none';
    confirmCallback = null;
  }

  document.getElementById('confirmYesBtn').onclick = function() {
    if (confirmCallback) confirmCallback();
    closeConfirmModal();
  };

  function getBackups() {
    try {
      var arr = JSON.parse(safeGet('obvalka_backups', '[]'));
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function saveLocalBackup() {
    var now = new Date();
    var stamp = String(now.getDate()).padStart(2, '0') + '.' +
                String(now.getMonth() + 1).padStart(2, '0') + '.' +
                now.getFullYear() + ' ' +
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0');
    var list = getBackups();
    list.unshift({
      id: Date.now(),
      stamp: stamp,
      recCount: records.length,
      offCount: dayOffs.length,
      records: records,
      dayOffs: dayOffs,
      rate: document.getElementById('ratePerKg').value
    });
    if (list.length > 8) list = list.slice(0, 8);
    safeSet('obvalka_backups', JSON.stringify(list));
    showToast('База сохранена (' + records.length + ' зап.)');
  }

  function openRestoreModal() {
    renderBackupList();
    document.getElementById('restoreModal').style.display = 'flex';
  }

  function closeRestoreModal() {
    document.getElementById('restoreModal').style.display = 'none';
  }

  function renderBackupList() {
    var container = document.getElementById('backupListContainer');
    while (container.firstChild) container.removeChild(container.firstChild);

    var list = getBackups();
    if (list.length === 0) {
      var p = document.createElement('div');
      p.style.fontSize = '12px';
      p.style.color = 'var(--muted)';
      p.style.padding = '12px 0';
      p.innerText = 'Сохранённых копий пока нет';
      container.appendChild(p);
      return;
    }

    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      var rCnt = Array.isArray(b.records) ? b.records.length : (b.recCount || 0);
      var oCnt = Array.isArray(b.dayOffs) ? b.dayOffs.length : (b.offCount || 0);
      var titleText = b.stamp || 'Резервная копия #' + (i + 1);

      var itemDiv = document.createElement('div');
      itemDiv.className = 'backup-item';

      var infoDiv = document.createElement('div');
      var tDiv = document.createElement('div');
      tDiv.style.fontSize = '13px';
      tDiv.style.fontWeight = '700';
      tDiv.innerText = titleText;

      var sDiv = document.createElement('div');
      sDiv.style.fontSize = '11px';
      sDiv.style.color = 'var(--muted)';
      sDiv.innerText = 'Записей: ' + rCnt + ', вых: ' + oCnt;

      infoDiv.appendChild(tDiv);
      infoDiv.appendChild(sDiv);

      var actDiv = document.createElement('div');
      actDiv.className = 'backup-item-actions';

      var restBtn = document.createElement('button');
      restBtn.className = 'restore-item-btn';
      restBtn.innerText = 'Восстановить';
      (function(idx) {
        restBtn.onclick = function() {
          var curList = getBackups();
          var chosen = curList[idx];
          if (chosen) {
            records = Array.isArray(chosen.records) ? chosen.records : [];
            dayOffs = Array.isArray(chosen.dayOffs) ? chosen.dayOffs : [];
            if (chosen.rate !== undefined) {
              document.getElementById('ratePerKg').value = chosen.rate;
              saveRate();
            }
            persistData();
            calcPreview();
            renderAll();
            closeRestoreModal();
            showToast('База восстановлена');
          }
        };
      })(i);

      var delBtn = document.createElement('button');
      delBtn.className = 'del-backup-btn';
      delBtn.innerText = '✕';
      (function(idx) {
        delBtn.onclick = function() {
          openConfirm('Удалить эту сохранённую базу?<br>Вы уверены?', function() {
            var curList = getBackups();
            curList.splice(idx, 1);
            safeSet('obvalka_backups', JSON.stringify(curList));
            renderBackupList();
            showToast('Копия удалена');
          });
        };
      })(i);

      actDiv.appendChild(restBtn);
      actDiv.appendChild(delBtn);

      itemDiv.appendChild(infoDiv);
      itemDiv.appendChild(actDiv);
      container.appendChild(itemDiv);
    }
  }

  function checkOnlineUpdate(manual) {
    if (!navigator.onLine) {
      if (manual) showToast('Нет подключения к сети');
      return;
    }
    var url = window.location.href.split('?')[0] + '?t=' + Date.now();
    fetch(url, { cache: 'no-store' }).then(function(resp) {
      return resp.text();
    }).then(function(html) {
      var m = html.match(/APP_VERSION\s*=\s*([0-9.]+)/);
      if (m && parseFloat(m[1]) > APP_VERSION) {
        showToast('Доступна v ' + m[1] + ', обновляю...');
        setTimeout(function() {
          window.location.href = window.location.href.split('?')[0] + '?v=' + Date.now();
        }, 1200);
      } else if (manual) {
        showToast('У вас актуальная версия v ' + APP_VERSION);
      }
    }).catch(function() {
      if (manual) showToast('Не удалось проверить обновление');
    });
  }

  loadData();
  calcPreview();
  renderAll();
  setTimeout(function() { checkOnlineUpdate(false); }, 1500);
</script>
