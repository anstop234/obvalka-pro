<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Обвалка PRO</title>
<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #f0f0f0;
    --subtext: #9e9e9e;
    --border: #555555;
    --input-bg: #252525;
    --cell-bg: #2a2a2a;
    --cell-other: #181818;
    --cell-other-text: #555555;
    --green: #00c853;
    --green-dark: #009624;
    --green-tint: rgba(0, 200, 83, 0.12);
    --yellow: #ffab00;
    --yellow-tint: rgba(255, 171, 0, 0.22);
    --red: #ff5252;
    --theme-btn-bg: #f0f0f0;
    --theme-btn-text: #121212;
  }

  body.light {
    --bg: #f2f3f5;
    --card: #ffffff;
    --text: #111111;
    --subtext: #555555;
    --border: #888888;
    --input-bg: #f7f8fa;
    --cell-bg: #eef0f3;
    --cell-other: #f8f9fa;
    --cell-other-text: #000000;
    --green: #00b248;
    --green-dark: #008636;
    --green-tint: rgba(0, 178, 72, 0.12);
    --yellow: #ffab00;
    --yellow-tint: rgba(255, 171, 0, 0.28);
    --red: #e53935;
    --theme-btn-bg: #252525;
    --theme-btn-text: #ffffff;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    margin: 0;
    padding: 6px;
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.25;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 8px;
  }

  /* Header */
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 5px;
  }

  .nav-btn {
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    width: 32px;
    height: 26px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .month-title-wrap {
    display: flex;
    align-items: baseline;
    gap: 5px;
  }

  .month-title {
    font-size: 16px;
    font-weight: 700;
  }

  .ver-badge {
    font-size: 10px;
    font-weight: 500;
    color: var(--text);
    opacity: 0.85;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .icon-btn {
    width: 28px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  .update-btn {
    background: var(--input-bg);
    color: var(--text);
  }

  .theme-btn {
    background: var(--theme-btn-bg);
    color: var(--theme-btn-text);
  }

  /* Tabs */
  .tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    margin-bottom: 5px;
  }

  .tab-btn {
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 2px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }

  .tab-btn.active {
    background: var(--green);
    border-color: var(--green);
    color: #000000;
  }

  /* Calendar Grid */
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    text-align: center;
    font-size: 11px;
    color: var(--subtext);
    margin-bottom: 2px;
    font-weight: 600;
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    touch-action: pan-y;
  }

  .day-cell {
    background: var(--cell-bg);
    border-radius: 5px;
    padding: 3px 0;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    line-height: 1.2;
    border: 1px solid transparent;
  }

  .day-cell.other-month {
    background: var(--cell-other);
    color: var(--cell-other-text);
  }

  body.light .day-cell {
    color: #000000;
  }

  body.light .day-cell.other-month {
    color: #000000;
    opacity: 0.45;
  }

  .day-cell.in-range {
    background: var(--yellow-tint);
    border-color: rgba(255, 171, 0, 0.45);
  }

  .day-cell.selected {
    background: var(--yellow) !important;
    color: #000000 !important;
    font-weight: 800;
    border-color: var(--yellow);
    opacity: 1 !important;
  }

  .day-cell.has-data::after {
    content: "";
    display: block;
    width: 14px;
    height: 2px;
    background: var(--green);
    margin: 1px auto 0;
    border-radius: 1px;
  }

  .day-cell.selected.has-data::after {
    background: #000000;
  }

  .day-cell.is-dayoff {
    border: 1px solid var(--red);
  }

  .dayoff-mark {
    position: absolute;
    top: 0;
    right: 2px;
    font-size: 8px;
    color: var(--red);
    font-weight: 800;
    line-height: 1;
  }

  .cal-hint {
    text-align: center;
    font-size: 10px;
    color: var(--subtext);
    margin: 3px 0 4px;
  }

  .dayoff-full-btn {
    width: 100%;
    height: 24px;
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  /* Records list */
  .records-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 3px;
    min-height: 20px;
  }

  .records-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--subtext);
    text-transform: uppercase;
  }

  .undo-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .undo-btn {
    background: var(--yellow);
    color: #000000;
    border: none;
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  .clear-undo-btn {
    background: var(--red);
    color: #ffffff;
    border: none;
    border-radius: 5px;
    width: 20px;
    height: 19px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .records-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 125px;
    overflow-y: auto;
  }

  .record-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 0;
    border-bottom: 1px solid rgba(128, 128, 128, 0.18);
    font-size: 12px;
    line-height: 1.15;
  }

  .record-item:last-child {
    border-bottom: none;
  }

  .rec-dayoff {
    color: var(--red);
    font-weight: 600;
  }

  .del-rec-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--red);
    border-radius: 4px;
    width: 22px;
    height: 20px;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Summary Card */
  .summary-card {
    background: var(--green-tint);
    border: 1px solid var(--green);
    border-radius: 10px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .summary-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .summary-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--green);
    text-transform: uppercase;
  }

  .summary-stats {
    font-size: 13px;
    font-weight: 700;
  }

  .summary-money {
    font-size: 18px;
    font-weight: 800;
    color: var(--yellow);
    line-height: 1.1;
  }

  .report-btns {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .rep-btn {
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    white-space: nowrap;
  }

  .rep-full {
    background: var(--green);
    border: 1px solid var(--green);
    color: #000000;
  }

  .rep-short {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
  }

  /* Input Form */
  .form-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
    font-size: 12px;
  }

  .selected-date-label {
    font-weight: 700;
  }

  .input-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .input-row label {
    font-size: 14px;
    font-weight: 600;
  }

  .input-box {
    width: 125px;
    height: 30px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    text-align: right;
    padding: 0 8px;
    outline: none;
    user-select: text;
    -webkit-appearance: none;
    appearance: none;
  }

  .input-box:focus {
    border-color: var(--green);
  }

  .shift-preview {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 5px 0;
    font-size: 12px;
    font-weight: 700;
  }

  .shift-preview-vals {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .shift-kg {
    color: var(--green);
    font-size: 14px;
  }

  .shift-rub {
    color: var(--yellow);
    font-size: 16px;
    font-weight: 800;
  }

  .add-btn {
    width: 100%;
    height: 34px;
    background: var(--green);
    border: none;
    border-radius: 7px;
    color: #000000;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.3px;
  }

  /* Bottom Backup Bar */
  .backup-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .backup-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    height: 32px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  /* Modals */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px;
    z-index: 1000;
  }

  .modal-backdrop.top-modal {
    z-index: 2000;
  }

  .modal-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .modal-title {
    font-size: 15px;
    font-weight: 700;
  }

  .modal-textarea {
    width: 100%;
    height: 150px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: monospace;
    font-size: 12px;
    padding: 8px;
    resize: none;
    user-select: text;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .m-btn {
    padding: 7px 14px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
  }

  .m-btn-green {
    background: var(--green);
    border-color: var(--green);
    color: #000000;
  }

  .m-btn-red {
    background: var(--red);
    border-color: var(--red);
    color: #ffffff;
  }

  .backup-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 210px;
    overflow-y: auto;
  }

  .backup-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 8px;
    font-size: 12px;
  }

  .backup-item-btns {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #222222;
    color: #ffffff;
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    z-index: 3000;
    display: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="container">
  <!-- Calendar Card -->
  <div class="card">
    <div class="cal-header">
      <button class="nav-btn" id="prevMonthBtn">◀</button>
      <div class="month-title-wrap">
        <span class="month-title" id="monthTitle">Ноябрь 2026</span>
        <span class="ver-badge" id="verBadge">v 6.4</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn update-btn" id="checkUpdateBtn" title="Проверить обновление">🔄</button>
        <button class="icon-btn theme-btn" id="themeBtn" title="Сменить тему">☀️</button>
        <button class="nav-btn" id="nextMonthBtn">▶</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-mode="day">День</button>
      <button class="tab-btn" data-mode="week">Неделя</button>
      <button class="tab-btn" data-mode="half">2х недели</button>
      <button class="tab-btn" data-mode="month">Месяц</button>
      <button class="tab-btn" data-mode="year">Год</button>
    </div>

    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
    <div class="cal-hint">Нажмите на день или протяните пальцем для выбора периода</div>
    <button class="dayoff-full-btn" id="dayoffBtn">✕ ВЫХОДНОЙ</button>
  </div>

  <!-- Records Card -->
  <div class="card">
    <div class="records-header">
      <span class="records-title" id="recordsTitle">ЗАПИСИ (ДЕНЬ)</span>
      <div class="undo-group" id="undoGroup" style="display:none;">
        <button class="undo-btn" id="undoBtn">↩ Отменить удаление (0)</button>
        <button class="clear-undo-btn" id="clearUndoBtn" title="Очистить удалённые">✕</button>
      </div>
    </div>
    <div class="records-list" id="recordsList"></div>
  </div>

  <!-- Summary Card -->
  <div class="summary-card">
    <div class="summary-left">
      <div class="summary-label" id="summaryLabel">ИТОГ ЗА ДЕНЬ</div>
      <div class="summary-stats" id="summaryStats">0 кор. | 0 кг</div>
      <div class="summary-money" id="summaryMoney">0 ₽</div>
    </div>
    <div class="report-btns">
      <button class="rep-btn rep-full" id="fullRepBtn">📤 Полный отчёт</button>
      <button class="rep-btn rep-short" id="shortRepBtn">📋 Краткий отчёт</button>
    </div>
  </div>

  <!-- Input Card -->
  <div class="card">
    <div class="form-header">
      <span style="color:var(--subtext);">Выбрана дата:</span>
      <span class="selected-date-label" id="selectedDateLabel">22 ноября</span>
    </div>
    <div class="input-row">
      <label for="workerInput">Обвальщик:</label>
      <input type="text" class="input-box" id="workerInput" placeholder="Имя">
    </div>
    <div class="input-row">
      <label for="boxesInput">Коробки (шт):</label>
      <input type="text" inputmode="numeric" class="input-box" id="boxesInput" placeholder="0">
    </div>
    <div class="input-row">
      <label for="weightInput">Вес коробки (кг):</label>
      <input type="text" inputmode="decimal" class="input-box" id="weightInput" placeholder="00.0">
    </div>
    <div class="input-row">
      <label for="rateInput">Ставка за 1 кг (₽):</label>
      <input type="text" inputmode="decimal" class="input-box" id="rateInput" placeholder="0.0">
    </div>
    <div class="shift-preview">
      <span>ИТОГО ЗА СМЕНУ:</span>
      <div class="shift-preview-vals">
        <span class="shift-kg" id="shiftKg">0 кг</span>
        <span class="shift-rub" id="shiftRub">0 ₽</span>
      </div>
    </div>
    <button class="add-btn" id="addRecordBtn">+ ДОБАВИТЬ ЗАПИСЬ</button>
  </div>

  <!-- Bottom Backup Bar -->
  <div class="backup-bar">
    <button class="backup-btn" id="saveBackupBtn">💾 СОХРАНИТЬ БАЗУ</button>
    <button class="backup-btn" id="openRestoreBtn">📂 ВОССТАНОВИТЬ</button>
  </div>
</div>

<!-- Report Preview Modal -->
<div class="modal-backdrop" id="reportModal">
  <div class="modal-box">
    <div class="modal-title" id="reportModalTitle">Предпросмотр отчёта</div>
    <textarea class="modal-textarea" id="reportModalText" readonly></textarea>
    <div class="modal-actions">
      <button class="m-btn" id="reportCancelBtn">Отмена</button>
      <button class="m-btn m-btn-green" id="reportSendBtn">Отправить</button>
    </div>
  </div>
</div>

<!-- Restore Modal -->
<div class="modal-backdrop" id="restoreModal">
  <div class="modal-box">
    <div class="modal-title">Сохранённые копии в телефоне</div>
    <div class="backup-list" id="backupList"></div>
    <div id="transferArea" style="display:none; flex-direction:column; gap:6px;">
      <textarea class="modal-textarea" id="transferCodeInput" style="height:80px;" placeholder="Вставьте код базы для восстановления или скопируйте текущий"></textarea>
      <div class="modal-actions">
        <button class="m-btn" id="copyTransferBtn">Скопировать код</button>
        <button class="m-btn m-btn-green" id="applyTransferBtn">Загрузить код</button>
      </div>
    </div>
    <div class="modal-actions" style="justify-content:space-between;">
      <button class="m-btn" id="toggleTransferBtn">🔑 Перенос / Код</button>
      <button class="m-btn" id="closeRestoreBtn">Закрыть</button>
    </div>
  </div>
</div>

<!-- Confirm Modal (Top Layer) -->
<div class="modal-backdrop top-modal" id="confirmModal">
  <div class="modal-box">
    <div class="modal-title" id="confirmText">Вы уверены?</div>
    <div class="modal-actions">
      <button class="m-btn" id="confirmNoBtn">Нет</button>
      <button class="m-btn m-btn-red" id="confirmYesBtn">Да</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  var APP_VERSION = "6.4";
  var STORAGE_KEY = "obvalka_pro_records_v1";
  var BACKUPS_KEY = "obvalka_pro_backups_v1";
  var SETTINGS_KEY = "obvalka_pro_settings_v1";
  var AUTO_DAY_KEY = "obvalka_pro_autobackup_day";

  var MONTHS_NOM = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  var MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var MONTHS_SHORT = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

  var records = [];
  var undoStack = [];
  var settings = { worker: "", rate: "", theme: "dark" };

  var now = new Date();
  var viewYear = now.getFullYear();
  var viewMonth = now.getMonth();
  var selectedDateStr = formatDateKey(now);
  var mode = "day";
  var isManualRange = false;
  var rangeStartStr = selectedDateStr;
  var rangeEndStr = selectedDateStr;
  var isDragging = false;
  var dragStartStr = null;
  var confirmCallback = null;

  function pad2(n) {
    return n < 10 ? "0" + n : "" + n;
  }

  function formatDateKey(d) {
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function parseDateKey(str) {
    var p = str.split("-");
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }

  function formatDayMonthGen(str) {
    var d = parseDateKey(str);
    return d.getDate() + " " + MONTHS_GEN[d.getMonth()];
  }

  function formatDayMonthShort(str) {
    var d = parseDateKey(str);
    return d.getDate() + " " + MONTHS_SHORT[d.getMonth()];
  }

  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(t._timer);
    t._timer = setTimeout(function() {
      t.style.display = "none";
    }, 2400);
  }

  function safeGet(key, fallback) {
    try {
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    } catch (e) {
      return fallback;
    }
  }

  function safeSet(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {}
    syncIDB(key, val);
  }

  function openIDB(cb) {
    try {
      if (!window.indexedDB) return;
      var req = indexedDB.open("ObvalkaProDB", 1);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains("kv")) {
          db.createObjectStore("kv");
        }
      };
      req.onsuccess = function(e) {
        cb(e.target.result);
      };
    } catch (e) {}
  }

  function syncIDB(key, val) {
    openIDB(function(db) {
      try {
        var tx = db.transaction("kv", "readwrite");
        tx.objectStore("kv").put(val, key);
      } catch (e) {}
    });
  }

  function restoreFromIDBIfEmpty() {
    openIDB(function(db) {
      try {
        var tx = db.transaction("kv", "readonly");
        var req = tx.objectStore("kv").get(STORAGE_KEY);
        req.onsuccess = function() {
          if (req.result && Array.isArray(req.result) && req.result.length > 0 && records.length === 0) {
            records = sanitizeRecords(req.result);
            safeSet(STORAGE_KEY, records);
            renderAll();
          }
        };
      } catch (e) {}
    });
  }

  function sanitizeRecords(arr) {
    if (!Array.isArray(arr)) return [];
    var clean = [];
    for (var i = 0; i < arr.length; i++) {
      var r = arr[i];
      if (!r || !r.date) continue;
      if (r.type === "dayoff") {
        clean.push({ id: r.id || (Date.now() + i), date: r.date, type: "dayoff" });
      } else {
        var b = parseFloat(r.boxes) || 0;
        var w = parseFloat(r.weight) || 0;
        var rt = parseFloat(r.rate) || 0;
        var tw = Math.round(b * w * 100) / 100;
        var sum = Math.round(tw * rt * 100) / 100;
        clean.push({
          id: r.id || (Date.now() + i),
          date: r.date,
          type: "work",
          boxes: b,
          weight: w,
          rate: rt,
          totalWeight: tw,
          totalSum: sum
        });
      }
    }
    return clean;
  }

  function loadInitialData() {
    records = sanitizeRecords(safeGet(STORAGE_KEY, []));
    var savedSet = safeGet(SETTINGS_KEY, null);
    if (savedSet) {
      settings.worker = savedSet.worker || "";
      settings.rate = savedSet.rate || "";
      settings.theme = savedSet.theme || "dark";
    }
    if (settings.theme === "light") {
      document.body.classList.add("light");
      document.getElementById("themeBtn").textContent = "🌙";
    }
    document.getElementById("workerInput").value = settings.worker;
    document.getElementById("rateInput").value = settings.rate;
    restoreFromIDBIfEmpty();
  }

  function saveRecords() {
    safeSet(STORAGE_KEY, records);
  }

  function saveSettings() {
    settings.worker = document.getElementById("workerInput").value.trim();
    settings.rate = document.getElementById("rateInput").value.trim();
    safeSet(SETTINGS_KEY, settings);
  }

  function createBackupEntry(isAuto) {
    var list = safeGet(BACKUPS_KEY, []);
    if (!Array.isArray(list)) list = [];
    var d = new Date();
    var stamp = pad2(d.getDate()) + "." + pad2(d.getMonth() + 1) + "." + d.getFullYear() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    if (isAuto) stamp += " (авто)";
    list.unshift({
      id: Date.now(),
      label: stamp,
      count: records.length,
      records: records,
      settings: settings
    });
    if (list.length > 8) list = list.slice(0, 8);
    safeSet(BACKUPS_KEY, list);
  }

  function triggerDailyAutoBackup() {
    var todayStr = formatDateKey(new Date());
    var lastAuto = safeGet(AUTO_DAY_KEY, "");
    if (lastAuto !== todayStr && records.length > 0) {
      createBackupEntry(true);
      safeSet(AUTO_DAY_KEY, todayStr);
    }
  }

  function getActiveRange() {
    if (isManualRange) {
      return rangeStartStr <= rangeEndStr ? [rangeStartStr, rangeEndStr] : [rangeEndStr, rangeStartStr];
    }
    var d = parseDateKey(selectedDateStr);
    var y = d.getFullYear();
    var m = d.getMonth();
    var day = d.getDate();

    if (mode === "day") {
      return [selectedDateStr, selectedDateStr];
    }
    if (mode === "week") {
      var wd = d.getDay();
      var diffToMon = wd === 0 ? -6 : 1 - wd;
      var mon = new Date(y, m, day + diffToMon);
      var sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
      return [formatDateKey(mon), formatDateKey(sun)];
    }
    if (mode === "half") {
      var lastDay = new Date(y, m + 1, 0).getDate();
      if (day <= 15) {
        return [formatDateKey(new Date(y, m, 1)), formatDateKey(new Date(y, m, 15))];
      } else {
        return [formatDateKey(new Date(y, m, 16)), formatDateKey(new Date(y, m, lastDay))];
      }
    }
    if (mode === "month") {
      var lastM = new Date(y, m + 1, 0).getDate();
      return [formatDateKey(new Date(y, m, 1)), formatDateKey(new Date(y, m, lastM))];
    }
    if (mode === "year") {
      return [formatDateKey(new Date(y, 0, 1)), formatDateKey(new Date(y, 11, 31))];
    }
    return [selectedDateStr, selectedDateStr];
  }

  function renderCalendar() {
    document.getElementById("monthTitle").textContent = MONTHS_NOM[viewMonth] + " " + viewYear;
    var grid = document.getElementById("daysGrid");
    grid.innerHTML = "";

    var firstDayOfMonth = new Date(viewYear, viewMonth, 1);
    var startWeekday = firstDayOfMonth.getDay();
    var offset = startWeekday === 0 ? 6 : startWeekday - 1;
    var gridStart = new Date(viewYear, viewMonth, 1 - offset);

    var range = getActiveRange();
    var rStart = range[0];
    var rEnd = range[1];

    var workMap = {};
    var dayoffMap = {};
    for (var i = 0; i < records.length; i++) {
      if (records[i].type === "dayoff") {
        dayoffMap[records[i].date] = true;
      } else {
        workMap[records[i].date] = true;
      }
    }

    var totalCells = 42;
    var lastDayCurrent = new Date(viewYear, viewMonth + 1, 0).getDate();
    if (offset + lastDayCurrent <= 35) totalCells = 35;

    for (var c = 0; c < totalCells; c++) {
      var cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + c);
      var key = formatDateKey(cellDate);
      var cell = document.createElement("div");
      cell.className = "day-cell";
      cell.textContent = cellDate.getDate();
      cell.setAttribute("data-date", key);

      if (cellDate.getMonth() !== viewMonth) {
        cell.classList.add("other-month");
      }

      if (key >= rStart && key <= rEnd && rStart !== rEnd) {
        cell.classList.add("in-range");
      }

      if (key === selectedDateStr) {
        cell.classList.add("selected");
      }

      if (workMap[key]) {
        cell.classList.add("has-data");
      }

      if (dayoffMap[key]) {
        cell.classList.add("is-dayoff");
        var mark = document.createElement("span");
        mark.className = "dayoff-mark";
        mark.textContent = "×";
        cell.appendChild(mark);
      }

      grid.appendChild(cell);
    }
  }

  function formatMoney(num) {
    var fixed = (Math.round(num * 100) / 100).toString();
    var parts = fixed.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return parts.join(",") + " ₽";
  }

  function formatNumClean(num) {
    return (Math.round(num * 100) / 100).toString();
  }

  function renderRecordsAndSummary() {
    var range = getActiveRange();
    var rStart = range[0];
    var rEnd = range[1];

    var filtered = [];
    for (var i = 0; i < records.length; i++) {
      if (records[i].date >= rStart && records[i].date <= rEnd) {
        filtered.push(records[i]);
      }
    }
    filtered.sort(function(a, b) {
      if (a.date === b.date) return a.id - b.id;
      return a.date < b.date ? -1 : 1;
    });

    var periodText = "";
    if (rStart === rEnd) {
      periodText = formatDayMonthGen(rStart).toUpperCase();
    } else {
      periodText = formatDayMonthGen(rStart).toUpperCase() + " – " + formatDayMonthGen(rEnd).toUpperCase();
    }

    var modeNames = {
      day: "ДЕНЬ",
      week: "НЕДЕЛЯ",
      half: "2Х НЕДЕЛИ",
      month: "МЕСЯЦ",
      year: "ГОД"
    };
    var titleBadge = isManualRange ? "ПЕРИОД" : modeNames[mode];
    document.getElementById("recordsTitle").textContent = "ЗАПИСИ (" + titleBadge + " (" + periodText + "))";
    document.getElementById("summaryLabel").textContent = "ИТОГ ЗА " + titleBadge + " (" + periodText + ")";

    var undoGroup = document.getElementById("undoGroup");
    if (undoStack.length > 0) {
      undoGroup.style.display = "flex";
      document.getElementById("undoBtn").textContent = "↩ Отменить удаление (" + undoStack.length + ")";
    } else {
      undoGroup.style.display = "none";
    }

    var listEl = document.getElementById("recordsList");
    listEl.innerHTML = "";

    var totalBoxes = 0;
    var totalWeight = 0;
    var totalSum = 0;

    for (var j = 0; j < filtered.length; j++) {
      var rec = filtered[j];
      var row = document.createElement("div");
      row.className = "record-item";

      var info = document.createElement("span");
      if (rec.type === "dayoff") {
        info.className = "rec-dayoff";
        info.textContent = formatDayMonthGen(rec.date) + ": Выходной";
      } else {
        totalBoxes += rec.boxes;
        totalWeight += rec.totalWeight;
        totalSum += rec.totalSum;
        info.textContent = formatDayMonthGen(rec.date) + ": " + formatNumClean(rec.boxes) + " кор × " + formatNumClean(rec.weight) + " = " + formatNumClean(rec.totalWeight) + " кг (" + formatMoney(rec.totalSum) + ")";
      }

      var delBtn = document.createElement("button");
      delBtn.className = "del-rec-btn";
      delBtn.textContent = "✕";
      (function(recordId) {
        delBtn.onclick = function() {
          deleteRecordById(recordId);
        };
      })(rec.id);

      row.appendChild(info);
      row.appendChild(delBtn);
      listEl.appendChild(row);
    }

    document.getElementById("summaryStats").textContent = formatNumClean(totalBoxes) + " кор. | " + formatNumClean(totalWeight) + " кг";
    document.getElementById("summaryMoney").textContent = formatMoney(totalSum);
    document.getElementById("selectedDateLabel").textContent = formatDayMonthGen(selectedDateStr);
  }

  function updateShiftPreview() {
    var b = parseFloat(document.getElementById("boxesInput").value.replace(",", ".")) || 0;
    var w = parseFloat(document.getElementById("weightInput").value.replace(",", ".")) || 0;
    var r = parseFloat(document.getElementById("rateInput").value.replace(",", ".")) || 0;
    var tw = Math.round(b * w * 100) / 100;
    var sum = Math.round(tw * r * 100) / 100;
    document.getElementById("shiftKg").textContent = formatNumClean(tw) + " кг";
    document.getElementById("shiftRub").textContent = formatMoney(sum);
  }

  function renderAll() {
    renderCalendar();
    renderRecordsAndSummary();
    updateShiftPreview();
  }

  function selectDate(dateStr) {
    selectedDateStr = dateStr;
    isManualRange = false;
    var d = parseDateKey(dateStr);
    viewYear = d.getFullYear();
    viewMonth = d.getMonth();
    renderAll();
  }

  function deleteRecordById(id) {
    for (var i = 0; i < records.length; i++) {
      if (records[i].id === id) {
        undoStack.push(records[i]);
        records.splice(i, 1);
        break;
      }
    }
    saveRecords();
    renderAll();
  }

  function openConfirm(text, onYes) {
    document.getElementById("confirmText").textContent = text;
    confirmCallback = onYes;
    document.getElementById("confirmModal").style.display = "flex";
  }

  function closeConfirm() {
    document.getElementById("confirmModal").style.display = "none";
    confirmCallback = null;
  }

  function buildReportText(type) {
    var range = getActiveRange();
    var rStart = range[0];
    var rEnd = range[1];
    var worker = document.getElementById("workerInput").value.trim();

    var filtered = [];
    for (var i = 0; i < records.length; i++) {
      if (records[i].date >= rStart && records[i].date <= rEnd) {
        filtered.push(records[i]);
      }
    }
    filtered.sort(function(a, b) {
      if (a.date === b.date) return a.id - b.id;
      return a.date < b.date ? -1 : 1;
    });

    var totalBoxes = 0;
    var totalWeight = 0;
    var totalSum = 0;
    for (var j = 0; j < filtered.length; j++) {
      if (filtered[j].type !== "dayoff") {
        totalBoxes += filtered[j].boxes;
        totalWeight += filtered[j].totalWeight;
        totalSum += filtered[j].totalSum;
      }
    }

    var lines = [];
    if (type === "short") {
      if (worker) lines.push(worker);
      if (isManualRange && rStart !== rEnd) {
        lines.push(formatDayMonthShort(rStart) + " – " + formatDayMonthShort(rEnd));
      }
      lines.push("Вес: " + formatNumClean(totalWeight) + " кг " + formatNumClean(totalBoxes) + " кор.");
      return lines.join("\n");
    }

    // Full report
    if (rStart === rEnd && mode === "day" && !isManualRange) {
      if (worker) lines.push(worker);
      lines.push("Вес: " + formatNumClean(totalWeight) + " кг " + formatNumClean(totalBoxes) + " кор.");
      return lines.join("\n");
    }

    if (worker) lines.push(worker);
    var pStr = rStart === rEnd ? formatDayMonthGen(rStart) : (formatDayMonthGen(rStart) + " – " + formatDayMonthGen(rEnd));
    lines.push("Отчёт: " + pStr);
    lines.push("");

    for (var k = 0; k < filtered.length; k++) {
      var r = filtered[k];
      if (r.type === "dayoff") {
        lines.push(formatDayMonthShort(r.date) + " | вых");
      } else {
        var sFixed = (Math.round(r.totalSum * 100) / 100).toString();
        lines.push(formatDayMonthShort(r.date) + " | " + formatNumClean(r.boxes) + "кор | " + formatNumClean(r.totalWeight) + "кг | " + sFixed + "₽");
      }
    }
    lines.push("");
    var totFixed = (Math.round(totalSum * 100) / 100).toString();
    lines.push("ИТОГ: " + formatNumClean(totalBoxes) + "кор | " + formatNumClean(totalWeight) + "кг | " + totFixed + "₽");
    return lines.join("\n");
  }

  function openReportPreview(type) {
    var txt = buildReportText(type);
    document.getElementById("reportModalTitle").textContent = type === "full" ? "Полный отчёт" : "Краткий отчёт";
    document.getElementById("reportModalText").value = txt;
    document.getElementById("reportModal").style.display = "flex";
  }

  function shareText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
      }
    } catch (e) {}

    if (navigator.share) {
      navigator.share({ text: text }).catch(function() {});
    } else {
      window.location.href = "https://wa.me/?text=" + encodeURIComponent(text);
    }
  }

  function renderBackupList() {
    var list = safeGet(BACKUPS_KEY, []);
    var container = document.getElementById("backupList");
    container.innerHTML = "";
    if (!Array.isArray(list) || list.length === 0) {
      container.innerHTML = "<div style='color:var(--subtext); font-size:12px; text-align:center; padding:10px;'>Сохранённых копий пока нет</div>";
      return;
    }

    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var row = document.createElement("div");
      row.className = "backup-item";

      var info = document.createElement("span");
      var cnt = Array.isArray(item.records) ? item.records.length : (item.count || 0);
      info.textContent = (item.label || "Копия") + " (" + cnt + " зап.)";

      var btns = document.createElement("div");
      btns.className = "backup-item-btns";

      var restBtn = document.createElement("button");
      restBtn.className = "m-btn m-btn-green";
      restBtn.style.padding = "4px 8px";
      restBtn.style.fontSize = "11px";
      restBtn.textContent = "Восстановить";

      var delBtn = document.createElement("button");
      delBtn.className = "del-rec-btn";
      delBtn.textContent = "✕";

      (function(idx, bItem) {
        restBtn.onclick = function() {
          records = sanitizeRecords(bItem.records || []);
          saveRecords();
          if (bItem.settings) {
            settings = bItem.settings;
            document.getElementById("workerInput").value = settings.worker || "";
            document.getElementById("rateInput").value = settings.rate || "";
            saveSettings();
          }
          document.getElementById("restoreModal").style.display = "none";
          renderAll();
          showToast("База восстановлена");
        };

        delBtn.onclick = function() {
          openConfirm("Удалить эту сохранённую базу? Вы уверены?", function() {
            var cur = safeGet(BACKUPS_KEY, []);
            cur.splice(idx, 1);
            safeSet(BACKUPS_KEY, cur);
            renderBackupList();
          });
        };
      })(i, item);

      btns.appendChild(restBtn);
      btns.appendChild(delBtn);
      row.appendChild(info);
      row.appendChild(btns);
      container.appendChild(row);
    }
  }

  function checkForUpdates() {
    showToast("Проверка обновлений...");
    var url = window.location.href.split("?")[0] + "?nocache=" + Date.now();
    fetch(url, { cache: "no-store" })
      .then(function(res) { return res.text(); })
      .then(function(html) {
        var m = html.match(/APP_VERSION\s*=\s*"([^"]+)"/);
        if (m && m[1] && m[1] !== APP_VERSION) {
          showToast("Найдена версия v " + m[1] + ", обновляю...");
          if ("caches" in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) caches.delete(names[i]);
            });
          }
          setTimeout(function() {
            window.location.href = url;
          }, 700);
        } else {
          showToast("У вас актуальная версия v " + APP_VERSION);
        }
      })
      .catch(function() {
        showToast("Нет сети или локальный файл (v " + APP_VERSION + ")");
      });
  }

  // Event bindings
  document.getElementById("prevMonthBtn").onclick = function() {
    viewMonth--;
    if (viewMonth < 0) {
      viewMonth = 11;
      viewYear--;
    }
    var curD = parseDateKey(selectedDateStr);
    var maxD = new Date(viewYear, viewMonth + 1, 0).getDate();
    selectedDateStr = formatDateKey(new Date(viewYear, viewMonth, Math.min(curD.getDate(), maxD)));
    renderAll();
  };

  document.getElementById("nextMonthBtn").onclick = function() {
    viewMonth++;
    if (viewMonth > 11) {
      viewMonth = 0;
      viewYear++;
    }
    var curD = parseDateKey(selectedDateStr);
    var maxD = new Date(viewYear, viewMonth + 1, 0).getDate();
    selectedDateStr = formatDateKey(new Date(viewYear, viewMonth, Math.min(curD.getDate(), maxD)));
    renderAll();
  };

  document.getElementById("themeBtn").onclick = function() {
    var isLight = document.body.classList.toggle("light");
    settings.theme = isLight ? "light" : "dark";
    this.textContent = isLight ? "🌙" : "☀️";
    saveSettings();
  };

  document.getElementById("checkUpdateBtn").onclick = checkForUpdates;

  var tabBtns = document.querySelectorAll(".tab-btn");
  for (var t = 0; t < tabBtns.length; t++) {
    tabBtns[t].onclick = function() {
      for (var k = 0; k < tabBtns.length; k++) tabBtns[k].classList.remove("active");
      this.classList.add("active");
      mode = this.getAttribute("data-mode");
      isManualRange = false;
      renderAll();
    };
  }

  var daysGrid = document.getElementById("daysGrid");
  daysGrid.addEventListener("pointerdown", function(e) {
    var cell = e.target.closest(".day-cell");
    if (!cell) return;
    var dStr = cell.getAttribute("data-date");
    isDragging = true;
    dragStartStr = dStr;
    selectDate(dStr);
  });

  daysGrid.addEventListener("pointermove", function(e) {
    if (!isDragging) return;
    var el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el) return;
    var cell = el.closest(".day-cell");
    if (!cell) return;
    var dStr = cell.getAttribute("data-date");
    if (dStr && dStr !== dragStartStr) {
      isManualRange = true;
      rangeStartStr = dragStartStr;
      rangeEndStr = dStr;
      renderAll();
    }
  });

  window.addEventListener("pointerup", function() {
    isDragging = false;
  });

  document.getElementById("dayoffBtn").onclick = function() {
    records.push({
      id: Date.now(),
      date: selectedDateStr,
      type: "dayoff"
    });
    saveRecords();
    triggerDailyAutoBackup();
    renderAll();
  };

  document.getElementById("addRecordBtn").onclick = function() {
    var b = parseFloat(document.getElementById("boxesInput").value.replace(",", ".")) || 0;
    var w = parseFloat(document.getElementById("weightInput").value.replace(",", ".")) || 0;
    var r = parseFloat(document.getElementById("rateInput").value.replace(",", ".")) || 0;
    if (b <= 0 || w <= 0) {
      showToast("Введите коробки и вес");
      return;
    }
    saveSettings();
    var tw = Math.round(b * w * 100) / 100;
    var sum = Math.round(tw * r * 100) / 100;
    records.push({
      id: Date.now(),
      date: selectedDateStr,
      type: "work",
      boxes: b,
      weight: w,
      rate: r,
      totalWeight: tw,
      totalSum: sum
    });
    document.getElementById("boxesInput").value = "";
    document.getElementById("weightInput").value = "";
    saveRecords();
    triggerDailyAutoBackup();
    renderAll();
  };

  function filterNumericInput(el, allowDecimal) {
    el.addEventListener("input", function() {
      var val = this.value.replace(",", ".");
      if (allowDecimal) {
        val = val.replace(/[^0-9.]/g, "");
        var parts = val.split(".");
        if (parts.length > 2) val = parts[0] + "." + parts.slice(1).join("");
      } else {
        val = val.replace(/[^0-9]/g, "");
      }
      this.value = val;
      updateShiftPreview();
    });
  }

  filterNumericInput(document.getElementById("boxesInput"), false);
  filterNumericInput(document.getElementById("weightInput"), true);
  filterNumericInput(document.getElementById("rateInput"), true);

  document.getElementById("workerInput").addEventListener("change", saveSettings);
  document.getElementById("rateInput").addEventListener("change", saveSettings);

  document.getElementById("undoBtn").onclick = function() {
    if (undoStack.length === 0) return;
    var last = undoStack.pop();
    records.push(last);
    saveRecords();
    renderAll();
  };

  document.getElementById("clearUndoBtn").onclick = function() {
    openConfirm("Все удаленные данные сотрутся. Вы уверены?", function() {
      undoStack = [];
      renderAll();
    });
  };

  document.getElementById("confirmNoBtn").onclick = closeConfirm;
  document.getElementById("confirmYesBtn").onclick = function() {
    var cb = confirmCallback;
    closeConfirm();
    if (cb) cb();
  };

  document.getElementById("fullRepBtn").onclick = function() {
    openReportPreview("full");
  };

  document.getElementById("shortRepBtn").onclick = function() {
    openReportPreview("short");
  };

  document.getElementById("reportCancelBtn").onclick = function() {
    document.getElementById("reportModal").style.display = "none";
  };

  document.getElementById("reportSendBtn").onclick = function() {
    var txt = document.getElementById("reportModalText").value;
    document.getElementById("reportModal").style.display = "none";
    shareText(txt);
  };

  document.getElementById("saveBackupBtn").onclick = function() {
    saveSettings();
    createBackupEntry(false);
    showToast("База сохранена (" + records.length + " зап.)");
  };

  document.getElementById("openRestoreBtn").onclick = function() {
    renderBackupList();
    document.getElementById("transferArea").style.display = "none";
    document.getElementById("restoreModal").style.display = "flex";
  };

  document.getElementById("closeRestoreBtn").onclick = function() {
    document.getElementById("restoreModal").style.display = "none";
  };

  document.getElementById("toggleTransferBtn").onclick = function() {
    var area = document.getElementById("transferArea");
    if (area.style.display === "none") {
      area.style.display = "flex";
      var payload = JSON.stringify({ records: records, settings: settings });
      document.getElementById("transferCodeInput").value = btoa(unescape(encodeURIComponent(payload)));
    } else {
      area.style.display = "none";
    }
  };

  document.getElementById("copyTransferBtn").onclick = function() {
    var inp = document.getElementById("transferCodeInput");
    inp.select();
    try {
      navigator.clipboard.writeText(inp.value);
      showToast("Код базы скопирован");
    } catch (e) {
      document.execCommand("copy");
      showToast("Код базы скопирован");
    }
  };

  document.getElementById("applyTransferBtn").onclick = function() {
    var raw = document.getElementById("transferCodeInput").value.trim();
    if (!raw) return;
    try {
      var decoded = decodeURIComponent(escape(atob(raw)));
      var obj = JSON.parse(decoded);
      if (obj && Array.isArray(obj.records)) {
        records = sanitizeRecords(obj.records);
        saveRecords();
        if (obj.settings) {
          settings = obj.settings;
          document.getElementById("workerInput").value = settings.worker || "";
          document.getElementById("rateInput").value = settings.rate || "";
          saveSettings();
        }
        document.getElementById("restoreModal").style.display = "none";
        renderAll();
        showToast("База успешно перенесена");
      }
    } catch (e) {
      showToast("Неверный код базы");
    }
  };

  // Init
  loadInitialData();
  renderAll();
})();
</script>
</body>
</html>
